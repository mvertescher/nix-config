# Bootstrap /etc/nix/nix.conf for a Mac, installed over the Nix
# installer's own before the first nix-darwin activation. That
# activation replaces it; darwin/configuration.nix lists this file's
# hash as known so it may. Keep it minimal: nothing here outlives the
# first deploy.
build-users-group = nixbld
experimental-features = nix-command flakes
# The deploying user copies unsigned derivations in; see
# darwin/configuration.nix for the steady-state equivalent.
trusted-users = root @admin
