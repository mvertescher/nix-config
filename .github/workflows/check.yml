# The builder API, checked on every push.
#
# This repo exports a library and defines no hosts, so `lib.mkNixos` and
# `lib.mkHome` have no in-repo consumer -- every real one is a private
# wrapper whose call sites cannot be updated from here. An API break
# would therefore surface at someone else's next pin bump rather than in
# this repo. `checks.builder-api` is the in-repo consumer; this runs it.
#
# Deliberately narrow, and narrow on purpose rather than by necessity:
# everything here is evaluation plus one trivial derivation, so it runs
# in about thirty seconds on every push without a binary cache.
#
# The two heavier things this repo can check each got their own
# path-filtered workflow instead, because `on:` applies a path filter per
# workflow rather than per job: goldens.yml for the cyberpunk-ui matrix,
# installer-iso.yml for the ISO. Both were once written off here as too
# big for a runner, on a "~14 GB disk" figure that turned out to be the
# old standard-runner spec -- a current `ubuntu-latest` has 145 GB with
# 87 GB free, the matrix peaks near 6 GB and the ISO near 5 GB. That
# sentence used to live in this comment; it was wrong.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first: nothing here is worth queueing.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  builder-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Named explicitly rather than `nix flake check`, which would also
      # evaluate `packages.installer-iso` -- a whole nixosSystem eval for
      # an artefact this job has no intention of building.
      - name: builder API accepts a minimal host set
        run: nix build --print-build-logs .#checks.x86_64-linux.builder-api

      - name: flake metadata is well-formed
        run: nix flake metadata --json > /dev/null
