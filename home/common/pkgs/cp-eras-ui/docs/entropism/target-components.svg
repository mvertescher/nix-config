  <!-- ============ COLUMN 4: palette + rules + TOOLKIT DIVERGENCE ============ -->
  <g>
    <text x="1420" y="120" font-size="13" letter-spacing="3" fill="#3d4d38">SAMPLED PALETTE</text>
    <g font-size="12" fill="#94bb94">
      <rect x="1420" y="134" width="34" height="20" fill="#110c07" stroke="#3d4d38"/><text x="1464" y="149">bg #110c07</text>
      <rect x="1420" y="162" width="34" height="20" fill="#9cb795"/><text x="1464" y="177">sage solid #9cb795</text>
      <rect x="1420" y="190" width="34" height="20" fill="#94bb94"/><text x="1464" y="205">sage text #94bb94</text>
      <rect x="1420" y="218" width="34" height="20" fill="#728f76"/><text x="1464" y="233">mid #728f76</text>
      <rect x="1420" y="246" width="34" height="20" fill="#5d7752"/><text x="1464" y="261">outline #5d7752</text>
      <rect x="1420" y="274" width="34" height="20" fill="#3d4d38"/><text x="1464" y="289">dim #3d4d38</text>
      <rect x="1420" y="302" width="34" height="20" fill="#1f2a1c"/><text x="1464" y="317">on-solid #1f2a1c</text>
    </g>

    <text x="1420" y="374" font-size="13" letter-spacing="3" fill="#3d4d38">ERA RULES (observed)</text>
    <g font-size="13" fill="#94bb94">
      <text x="1420" y="400">· ONE hue: sage green on warm dark</text>
      <text x="1420" y="422">· square everything; 1px strokes</text>
      <text x="1420" y="444">· no glow, no gradients, no rounding</text>
      <text x="1420" y="466">· selection = solid sage fill</text>
      <text x="1420" y="488">· segmented top bar, build-string</text>
      <text x="1420" y="510">&#160;&#160;footer on every screen</text>
      <text x="1420" y="532">· boxed-letter section headers</text>
      <text x="1420" y="554">· menu tiles carry caption strips</text>
      <text x="1420" y="576">· dense tiny maintenance captions</text>
    </g>

    <text x="1420" y="640" font-size="13" letter-spacing="3" fill="#94bb94">TOOLKIT DIVERGENCE (for the next agent)</text>
    <g font-size="12" fill="#728f76">
      <text x="1420" y="666">entropism-ui/src/colors.rs carries TWELVE</text>
      <text x="1420" y="684">colours - cybr's red #F75049, cyan #5EF6FF,</text>
      <text x="1420" y="702">mint #1DED83, violet, orange, gold - plus a</text>
      <text x="1420" y="720">glow.rs module. None of that exists in the</text>
      <text x="1420" y="738">reference: the era is ONE sage green, flat.</text>
      <text x="1420" y="756">Its COLOR_GREEN_ACCENT #8CBC88 is close to</text>
      <text x="1420" y="774">the sampled #94bb94 and is the only keeper.</text>
      <text x="1420" y="796">The desktop theme diverges too: its default</text>
      <text x="1420" y="814">burn-in variant is amber, an invention. Of</text>
      <text x="1420" y="832">its three variants, salvage-phosphor is the</text>
      <text x="1420" y="850">only one near the reference - and still</text>
      <text x="1420" y="868">cooler and darker than the sampled sage.</text>
      <text x="1420" y="890">Suggest: a reference-sampled variant named</text>
      <text x="1420" y="908">"nexus" (after the build strings), and the</text>
      <text x="1420" y="926">crate reduced to the one-hue system when it</text>
      <text x="1420" y="944">folds into cp-eras-ui.</text>
    </g>
  </g>

