<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Rajdhani">
  <!-- ENTROPISM component sheet, SAMPLED from the Behance Part 1
       entropism run (doc #24-32, the nine screens after the
       "ENTROPISM - NECESSITY OVER STYLE" title card: logins, mailbox
       tile menu, message view, 4ST store).

       Sampled palette (pixel reads off the 1400px modules):
         bg          #110c07 warm dark olive-brown (#160e0a upper,
                     #0d0603 lower - a lit CRT in a dark room)
         sage solid  #8ba685..#a3bc9e   selection fills, footer band
         sage text   #94bb94            labels, titles
         mid green   #728f76            top-bar text, secondary
         outline     #5d7752            1px strokes
         dim         #3d4d38            faint rules, captions
         on-solid    #1f2a1c            dark text on sage fills

       ONE hue. Everything square, 1px, no glow, no gradients in the
       UI itself. Selection is a solid sage fill. Dense tiny captions,
       build strings, segmented chrome: industrial terminal software
       that somebody keeps repairing. -->
  <defs>
    <linearGradient id="crt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a140c"/>
      <stop offset="45%" stop-color="#110c07"/>
      <stop offset="100%" stop-color="#0d0603"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#crt)"/>

  <!-- segmented top bar: the era's chrome -->
  <g font-size="13" letter-spacing="1">
    <rect x="40" y="34" width="380" height="24" fill="none" stroke="#5d7752" stroke-width="1"/>
    <text x="52" y="51" fill="#728f76">ENTROPISM&#160;&#160;COMPONENTSV2</text>
