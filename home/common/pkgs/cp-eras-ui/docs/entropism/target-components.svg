      <text x="1283" y="436" fill="#1f2a1c" font-weight="600">REPORT SPAM</text>
    </g>

    <!-- product card, both states -->
    <text x="980" y="510" font-size="13" letter-spacing="3" fill="#3d4d38">PRODUCT CARD ×2 STATES</text>
    <g>
      <rect x="980" y="524" width="170" height="230" fill="none" stroke="#5d7752" stroke-width="1"/>
