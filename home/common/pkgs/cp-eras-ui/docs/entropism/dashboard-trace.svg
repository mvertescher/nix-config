      <rect x="1329" y="142" width="26" height="26" fill="none" stroke="#9ac3a0" stroke-width="1.5"/>
      <text transform="translate(1342,162) scale(1.5,1)">C</text>
    </g>
    <g font-size="23" font-weight="600">
