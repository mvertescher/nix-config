  <g font-family="Rajdhani" fill="#a0d2a9">
    <g font-size="22" font-weight="bold" text-anchor="middle">
      <rect x="133" y="145" width="26" height="26" fill="none" stroke="#9ac3a0" stroke-width="1.5"/>
