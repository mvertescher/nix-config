<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- ENTROPISM dashboard-trace: schematic of images/entropism-store.png
       (the module hub — the two entropism source files are named the wrong
       way round; see docs/sources.md).

       Every coordinate below is measured, not eyeballed:
         scripts/extract_spec.py images/entropism-store.png -o /tmp/src.json
       plus targeted row/column probes for the outline-only geometry, and the
       trace is held to the source by
         scripts/fidelity_check.sh -\-inventory entropism dashboard

       What the source actually shows, top to bottom:
         - a full-width header strip, x 49..1547, y 43..69, with dividers at
           x 465 and x 1353: RIPPERDOC SURGICAL SOFTWAREV2 / STORE ACCESS
           SCREEN / FLAIR TRS 5MMP (the hub screen itself carries the
           STORE ACCESS SCREEN caption — that is the material, not an error).
           Text runs x 62..305 / 519..672 / 1383..1494, cap y 49..59.
         - three boxed section letters (26x26) with labels: A MAIL BOX
           (box x 133..158, y 145..170; label x 171..254, cap 149..163),
           B MESSAGE (box x 1014..1039, y 145..170; label x 1049..1132),
           C SECURITY LEVEL (box x 1329..1354, y 142..167; label on two
           lines, SECURITY x 1381..1465 cap 147..161, LEVEL x 1381..1433
           cap 172..185). Labels are a medium-weight face, cap 15, not
           letter-spaced. The boxed letters are bold and extended:
           A 18x14 (x 137..154, y 151..164), B and C 15x14.
         - a 3x2 TILE GRID: tiles 194 wide at x 128, 418, 716; row 1
           y 226..438, row 2 y 499..710; square corners, thin outline.
           Labels EMAILS / MATRIX / BRAINDANCE and SECURITY SYSTEMS /
           PRIVATE / DEVICES centred in the tiles, semibold, cap 14px
           (EMAILS x 189..253 y 313..327; SECURITY x 179..264 y 577..591
           over SYSTEMS y 602..615; PRIVATE x 478..549 y 586..599).
           BRAINDANCE (row 1, tile 3) is filled solid sage — the selection.
           Each tile's foot carries a CAPTION BOX: a brighter, thinner
           outlined rectangle whose sides and bottom coincide with the
           tile frame and whose top rule sits at y 410 (row 2: y 682),
           split by a divider 96px in (x 224 / 514 / 812). Cells hold real
           text: 85SD4F3Q5S41 (x 134..192, cap 415..422) | COMBAT
           COLONIZATION (x 231..311, cap 415..422) over DEFENCE PROGRAM
           (x 231..299, cap 425..431). On the selected tile the box and
           text are dark on the sage fill.
         - a MESSAGE detail panel, x 1014..1275, y 215..723: BRAINDANCE
           heading (x 1033..1148, cap 250..264, bold) over a full-width
           underline at y 281, then lorem body copy at x 1033 on a 21px
           pitch, cap tops 310..436: SEVEN lines ending "gravi- / da.",
           a blank line, then THREE lines (Risus commodo viverra ma- /
           ecenas accumsan lacus vel / facilisis.) at cap tops 478 / 499 /
           520. Line widths 218 208 222 198 199 210 21 / 217 211 62.
         - a SECURITY LEVEL badge column: four 68x68 boxes at x 1380,
           y 214 / 304 / 393 / 482, labelled T1..T4, with T2 filled solid
           (the extractor reads it at exactly [1380,304,68,68]). The
           glyphs are a bold EXTENDED face: cap 18px, T1 26 wide, T2 34,
           T3 36, T4 36 (x 1396..1431), centred on the box.
         - a full-width footer strip, x 49..1547, y 847..872: INTERFACE
           LOADED / PROVIDED BY NEXUS NETWORK V10.8 / BUILD 6.47.48441.R15

       Stroke profile, measured 2026-09-03 at FULL resolution (3840 wide;
       column/row probes through the header, every tile, the panel, the
       badges and the footer): every outlined frame is a 3px line at 3840
       = 1.25px in this frame, with a bright core (#82b393..#9ec2a0,
       mean ~#8fba97 — the era's sage TEXT tone, not a dimmer outline
       tone), a faint +12-lum overshoot ~5px out, and NO dark undershoot
       (ground 16, the "undershoot" 16..18). The 2px / #709174 profile
       that the 1600-wide rescale shows — and that the k-means palette
       below reports — is that 1.25px bright line spread by Lanczos over
       two half-bright pixels, ringed by the filter's negative lobe. The
       traces draw the material, so strokes here are 1.25px of the core
       colour on integer coordinates (which rsvg antialiases into the
       same two-pixel footprint the rescale has). The caption-box lines
       are heavier and brighter: 4px at 3840 = 1.7px, #a8d7a7.

       Text ink, measured the same way on the 1600 rescale (bright-tail
       mean over the run): header/footer strings #97c4a0, tile labels
       #acddb4, body copy #9fc09c. The face is a medium weight with tight
       tracking, cap 11; Rajdhani 500 at 17px, natural tracking, lands
       each header/footer run within 4px of the photo (241/158/112 and
       127/247/140 vs 244/154/112 and 130/250/142) at the photo's cap.

       Replaces the previous revision, which drew "four tiles in a row,
       caption strips, a build-rule at the foot" and claimed the app's
       3-per-row grid, sidebar and detail panel were not in the frame.
       That trace was written without reading the image (and against the
       wrong file); the material shows a 3-per-row grid WITH a detail
       panel and a badge column.

       Pass notes:
         2026-09-02  footer: only BUILD right-anchored (end 1525);
                     PROVIDED BY left-anchored at 517 as on the mailbox.
         2026-09-03  header strings: size 14 -> 17/500, x 60/477/1365 ->
                     61/518/1382, baseline 61 -> 60 (runs were 8% short,
                     40px left, cap 2px low); footer strings to match.
         2026-09-03  every outline 2px/1.5px #739676 -> 1.25px #8fba97
                     (full-res measurement above); letter boxes 1.5px
                     #9ac3a0.
         2026-09-03  caption strips were a dim 1.5px rule + divider with
                     grey bars; the photo has a bright inset box with
                     real text — redrawn (top rule 409 -> 410, divider
                     95 -> 96 in).
         2026-09-03  T1..T4 were Rajdhani regular 22 (cap 14, ~20 wide);
                     photo is bold extended (cap 18, 26..36 wide) —
                     bold 27 stretched 1.37..1.5 horizontally.
         2026-09-03  section labels 17/ls 2 -> 23/600 at measured runs
                     (natural tracking: 85/86/87/52 vs 84/84/85/53);
                     boxed letters bold 22 stretched 1.5-1.6; C box was
                     5px low (147 -> 142); tile labels 600/22 at measured
                     runs; panel body 5+3 bars -> 7+3 text lines as read
                     off the photo (500/17 stretched 1.16).
         2026-09-03  no textLength anywhere: rsvg-convert 2.62 ignores
                     textLength/lengthAdjust (verified — identical width
                     with and without), so runs are pinned with
                     letter-spacing or scale(sx,1) transforms instead.

       Palette sampled by k-means over the photo (extract_spec.py; the
       #739676 centroid is the rescale's diluted stroke, see above):
         ink   #a6d3a7 (3.3%, the solid fills)  #739676  #59755b  #3a4c38
         ground #0f0a03 (63.8%) #1c1a10 (19.5%) #232419 (9.2%) -->
  <defs>
    <radialGradient id="lift" cx="0.45" cy="0.45" r="0.75">
      <stop offset="0"   stop-color="#1c1a10"/>
      <stop offset="0.7" stop-color="#141107"/>
      <stop offset="1"   stop-color="#0f0a03"/>
    </radialGradient>
    <!-- one caption box, drawn at the tile's bottom-left corner (the
         tile's own frame is at y 0 here and the box's bottom edge lies on
         it): top rule 28px up, divider 96px in, two cells of small bold
         text at the measured runs -->
    <g id="caption" font-family="Rajdhani" font-weight="600" text-anchor="start">
      <path d="M 0,-28 H 194 M 96,-28 V 0" fill="none" stroke-width="1.7"/>
      <text transform="translate(6,-15) scale(0.78,1)" font-size="12">85SD4F3Q5S41</text>
      <text transform="translate(103,-15) scale(0.685,1)" font-size="12">COMBAT COLONIZATION</text>
      <text transform="translate(103,-6) scale(0.82,1)" font-size="10.5">DEFENCE PROGRAM</text>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#lift)"/>

  <!-- ==== header strip, y 43..69, dividers at x 465 and 1353 ==== -->
  <g>
    <rect x="49" y="43" width="1498" height="26" fill="none" stroke="#8fba97" stroke-width="1.25"/>
    <path d="M 465,43 V 69 M 1353,43 V 69" fill="none" stroke="#8fba97" stroke-width="1.25"/>
    <g font-family="Rajdhani" font-size="17" font-weight="500" fill="#97c4a0">
      <text x="61" y="60">RIPPERDOC SURGICAL SOFTWAREV2</text>
      <text x="518" y="60">STORE ACCESS SCREEN</text>
      <text x="1382" y="60">FLAIR TRS 5MMP</text>
    </g>
  </g>

  <!-- ==== section headings: boxes 26x26 holding a bold extended letter
       (photo A is 18x14, B/C 15x14 — Rajdhani Bold 22 stretched 1.5-1.6),
       labels Rajdhani 600 at 23 (cap 15, natural tracking hits the
