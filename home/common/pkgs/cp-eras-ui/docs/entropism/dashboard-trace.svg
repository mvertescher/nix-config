<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- ENTROPISM dashboard-trace: schematic of images/entropism-store.png
       (the module hub — the two entropism source files are named the wrong
       way round; see docs/sources.md).

       Every coordinate below is measured, not eyeballed:
         scripts/extract_spec.py images/entropism-store.png -o /tmp/src.json
       plus targeted row/column probes for the outline-only geometry, and the
       trace is held to the source by
         scripts/fidelity_check.sh -\-inventory entropism dashboard

       What the source actually shows, top to bottom:
         - a full-width header strip, x 49..1547, y 43..69, with dividers at
           x 465 and x 1353: RIPPERDOC SURGICAL SOFTWAREV2 / STORE ACCESS
           SCREEN / FLAIR TRS 5MMP (the hub screen itself carries the
           STORE ACCESS SCREEN caption — that is the material, not an error)
         - three boxed section letters with labels at y~147..174:
           A MAIL BOX (box x 132..158), B MESSAGE (x 1013..1040),
           C SECURITY LEVEL (x 1328..1354, label on two lines)
         - a 3x2 TILE GRID: tiles 194 wide at x 128, 418, 716; row 1
           y 226..438, row 2 y 499..710; square corners, thin outline.
           Labels EMAILS / MATRIX / BRAINDANCE and SECURITY SYSTEMS /
           PRIVATE / DEVICES centred in the tiles. BRAINDANCE (row 1,
           tile 3) is filled solid sage — the selection. Each tile's foot
           carries a two-cell caption strip (top rule at y 409 / y 681,
           internal divider 95px in): 85SD4F3Q5S41 | COMBAT COLONIZATION
           DEFENCE PROGRAM
         - a MESSAGE detail panel, x 1014..1275, y 215..723: BRAINDANCE
           heading over a full-width underline at y 281, then two lorem
           paragraphs (5 lines + 3 lines)
         - a SECURITY LEVEL badge column: four 68x68 boxes at x 1380,
           y 214 / 304 / 393 / 482, labelled T1..T4, with T2 filled solid
           (the extractor reads it at exactly [1380,304,68,68])
         - a full-width footer strip, x 49..1547, y 847..872: INTERFACE
           LOADED / PROVIDED BY NEXUS NETWORK V10.8 / BUILD 6.47.48441.R15

       Replaces the previous revision, which drew "four tiles in a row,
       caption strips, a build-rule at the foot" and claimed the app's
       3-per-row grid, sidebar and detail panel were not in the frame.
       That trace was written without reading the image (and against the
       wrong file); the material shows a 3-per-row grid WITH a detail
       panel and a badge column.

       Palette sampled by k-means over the photo (extract_spec.py):
         ink   #a6d3a7 (3.3%, the solid fills)  #739676  #59755b  #3a4c38
         ground #0f0a03 (63.8%) #1c1a10 (19.5%) #232419 (9.2%) -->
  <defs>
    <radialGradient id="lift" cx="0.45" cy="0.45" r="0.75">
      <stop offset="0"   stop-color="#1c1a10"/>
      <stop offset="0.7" stop-color="#141107"/>
      <stop offset="1"   stop-color="#0f0a03"/>
    </radialGradient>
    <!-- one caption strip, drawn at the tile's local origin: top rule,
         internal divider 95px in, small text in each cell -->
    <g id="caption">
      <path d="M 0,0 H 194" fill="none" stroke="#59755b" stroke-width="1.5"/>
      <path d="M 95,0 V 29" fill="none" stroke="#59755b" stroke-width="1.5"/>
      <rect x="7"   y="8" width="80" height="7" fill="#59755b"/>
      <rect x="103" y="5" width="82" height="6" fill="#59755b"/>
      <rect x="103" y="14" width="70" height="6" fill="#59755b"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#lift)"/>

  <!-- ==== header strip, y 43..69, dividers at x 465 and 1353 ==== -->
  <g>
    <rect x="49" y="43" width="1498" height="26" fill="none" stroke="#739676" stroke-width="1.5"/>
    <path d="M 465,43 V 69 M 1353,43 V 69" fill="none" stroke="#739676" stroke-width="1.5"/>
    <g font-family="Rajdhani" font-size="14" fill="#87b08d" letter-spacing="1">
      <text x="60" y="61">RIPPERDOC SURGICAL SOFTWAREV2</text>
      <text x="477" y="61">STORE ACCESS SCREEN</text>
      <text x="1365" y="61">FLAIR TRS 5MMP</text>
    </g>
  </g>

  <!-- ==== section headings, y 147..174 ==== -->
  <g font-family="Rajdhani" font-size="17" fill="#87b08d" letter-spacing="2">
    <rect x="132" y="147" width="26" height="26" fill="none" stroke="#87b08d" stroke-width="1.5"/>
    <text x="139" y="166">A</text>
    <text x="170" y="166">MAIL BOX</text>
    <rect x="1013" y="147" width="27" height="26" fill="none" stroke="#87b08d" stroke-width="1.5"/>
    <text x="1020" y="166">B</text>
    <text x="1049" y="166">MESSAGE</text>
    <rect x="1328" y="147" width="26" height="26" fill="none" stroke="#87b08d" stroke-width="1.5"/>
    <text x="1335" y="166">C</text>
    <text x="1381" y="160" font-size="15">SECURITY</text>
    <text x="1381" y="178" font-size="15">LEVEL</text>
  </g>

  <!-- ==== the 3x2 tile grid ==== -->
  <!-- row 1: y 226..438, caption rule at y 409 -->
  <g font-family="Rajdhani" font-size="19" letter-spacing="1.5" text-anchor="middle">
    <rect x="128" y="226" width="194" height="212" fill="none" stroke="#739676" stroke-width="2"/>
    <text x="225" y="327" fill="#a6d3a7">EMAILS</text>
    <use href="#caption" x="128" y="409" fill="#59755b"/>

    <rect x="418" y="226" width="194" height="212" fill="none" stroke="#739676" stroke-width="2"/>
    <text x="515" y="327" fill="#a6d3a7">MATRIX</text>
    <use href="#caption" x="418" y="409"/>

    <!-- the selection: solid sage fill, dark caption elements -->
    <rect x="716" y="227" width="194" height="211" fill="#a6d3a7"/>
    <text x="813" y="327" fill="#22301f">BRAINDANCE</text>
    <g transform="translate(716,409)">
      <path d="M 0,0 H 194" fill="none" stroke="#3a4c38" stroke-width="1.5"/>
      <path d="M 95,0 V 29" fill="none" stroke="#3a4c38" stroke-width="1.5"/>
      <rect x="7"   y="8" width="80" height="7" fill="#3a4c38"/>
      <rect x="103" y="5" width="82" height="6" fill="#3a4c38"/>
      <rect x="103" y="14" width="70" height="6" fill="#3a4c38"/>
    </g>

    <!-- row 2: y 499..710, caption rule at y 681 -->
    <rect x="128" y="499" width="194" height="211" fill="none" stroke="#739676" stroke-width="2"/>
    <text x="225" y="590" fill="#a6d3a7" font-size="17">SECURITY</text>
    <text x="225" y="610" fill="#a6d3a7" font-size="17">SYSTEMS</text>
    <use href="#caption" x="128" y="681"/>

    <rect x="418" y="499" width="194" height="211" fill="none" stroke="#739676" stroke-width="2"/>
    <text x="515" y="600" fill="#a6d3a7">PRIVATE</text>
    <use href="#caption" x="418" y="681"/>

    <rect x="716" y="499" width="194" height="211" fill="none" stroke="#739676" stroke-width="2"/>
    <text x="813" y="600" fill="#a6d3a7">DEVICES</text>
    <use href="#caption" x="716" y="681"/>
  </g>

  <!-- ==== MESSAGE detail panel, x 1014..1275, y 215..723 ==== -->
  <g>
    <rect x="1014" y="215" width="261" height="508" fill="none" stroke="#739676" stroke-width="2"/>
    <text x="1034" y="262" font-family="Rajdhani" font-size="20" letter-spacing="2"
          fill="#a6d3a7">BRAINDANCE</text>
    <path d="M 1014,281 H 1275" fill="none" stroke="#739676" stroke-width="1.5"/>
    <!-- body copy: five lines, blank, three lines (measured line pitch 21) -->
    <g fill="#59755b">
      <rect x="1034" y="308" width="222" height="10"/>
      <rect x="1034" y="329" width="214" height="10"/>
      <rect x="1034" y="350" width="220" height="10"/>
      <rect x="1034" y="371" width="208" height="10"/>
      <rect x="1034" y="392" width="120" height="10"/>
      <rect x="1034" y="413" width="216" height="10"/>
      <rect x="1034" y="434" width="210" height="10"/>
      <rect x="1034" y="455" width="96"  height="10"/>
    </g>
  </g>

  <!-- ==== SECURITY LEVEL badges: four 68x68 at x 1380, T2 filled ==== -->
  <g font-family="Rajdhani" font-size="22" letter-spacing="1" text-anchor="middle">
    <rect x="1380" y="214" width="68" height="68" fill="none" stroke="#739676" stroke-width="2"/>
    <text x="1414" y="256" fill="#a6d3a7">T1</text>
    <rect x="1380" y="304" width="68" height="68" fill="#a6d3a7"/>
    <text x="1414" y="346" fill="#22301f">T2</text>
    <rect x="1380" y="393" width="68" height="68" fill="none" stroke="#739676" stroke-width="2"/>
    <text x="1414" y="435" fill="#a6d3a7">T3</text>
    <rect x="1380" y="482" width="68" height="68" fill="none" stroke="#739676" stroke-width="2"/>
    <text x="1414" y="524" fill="#a6d3a7">T4</text>
  </g>

  <!-- ==== footer strip, y 847..872 ==== -->
  <g>
    <rect x="49" y="847" width="1498" height="25" fill="none" stroke="#739676" stroke-width="1.5"/>
    <g font-family="Rajdhani" font-size="14" fill="#87b08d" letter-spacing="1">
      <text x="60" y="864">INTERFACE LOADED</text>
      <text x="700" y="864">PROVIDED BY NEXUS NETWORK V10.8</text>
      <text x="1400" y="864">BUILD 6.47.48441.R15</text>
    </g>
  </g>
</svg>
