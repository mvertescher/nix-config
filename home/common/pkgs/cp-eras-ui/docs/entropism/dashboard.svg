<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Rajdhani">
  <!-- ENTROPISM DASHBOARD — ground truth: tests/golden/dashboard-entropism-1600x900.png
       Layout per src/screens/dashboard.rs Layout::TileRow arm, fractions of
       docs/entropism/dashboard-trace.svg (Behance screen #42). The trace is the
       measure, so the row is not an even grid: T2 (the selection) is the widest
       tile and the others taper around it, and the caption strips are narrower
       than their tiles except under T1 and T4.
       Palette: bg #110c07, sage solid #9cb795, fg #94bb94, mid #718f87
       (mid_ink, dim→fg at 0.6), border #5d7752, dim #3d4d38, on-select #1f2a1c;
       the field is border at 0.25 alpha over bg, the strips border at 0.4. -->
  <rect width="1600" height="900" fill="#110c07"/>

  <!-- dim-olive top field (trace rows 0-5, y 0..230). The era table has
       no field colour; the app draws border at 0.25 alpha over bg, which
       wgpu composites in linear space. The observed result is #323f2a,
       so that is what this drawing uses. -->
  <rect x="0" y="0" width="1600" height="230" fill="#323f2a"/>

  <!-- boxed-letter header top-left: [A] and TILE MENU (trace y 120..166) -->
  <g>
    <rect x="100" y="120" width="46" height="46" fill="none" stroke="#5d7752" stroke-width="1"/>
    <text x="123" y="152" text-anchor="middle" font-size="26" fill="#94bb94">A</text>
    <rect x="160" y="120" width="330" height="46" fill="none" stroke="#5d7752" stroke-width="1"/>
    <text x="325" y="150" text-anchor="middle" font-size="20" fill="#94bb94">TILE MENU</text>
  </g>

  <!-- the four tiles (trace rows 25-60%, y 270..560) -->
  <g>
    <!-- T1: VEHICLES, outlined dim-olive -->
    <rect x="96" y="270" width="178" height="290" fill="#3d4d38" stroke="#5d7752" stroke-width="1"/>
    <text x="104" y="307" font-size="14" fill="#94bb94">VEHICLES</text>
    <text x="104" y="322" font-size="9" fill="#94bb94">161-9A</text>

    <!-- T2: LOCATIONS — SELECTED, solid sage with selection ink -->
    <rect x="368" y="270" width="496" height="290" fill="#9cb795"/>
    <text x="376" y="307" font-size="14" fill="#1f2a1c">LOCATIONS</text>
    <text x="376" y="322" font-size="9" fill="#1f2a1c">161-9B</text>

    <!-- T3: FACTIONS, outlined dim-olive -->
    <rect x="896" y="270" width="400" height="290" fill="#3d4d38" stroke="#5d7752" stroke-width="1"/>
    <text x="904" y="307" font-size="14" fill="#94bb94">FACTIONS</text>
    <text x="904" y="322" font-size="9" fill="#94bb94">161-9C</text>

    <!-- T4: WEAPONS, outlined dim-olive -->
    <rect x="1328" y="270" width="208" height="290" fill="#3d4d38" stroke="#5d7752" stroke-width="1"/>
    <text x="1336" y="307" font-size="14" fill="#94bb94">WEAPONS</text>
    <text x="1336" y="322" font-size="9" fill="#94bb94">161-9D</text>
  </g>

  <!-- caption strips under each tile (trace y 596..630), faint olive bars
       (border at 0.4 over bg, composited #3d4e35) carrying the module's
       code and blurb at caption size -->
  <g font-size="7" fill="#718f87">
    <rect x="104" y="596" width="178" height="34" fill="#3d4e35"/>
    <text x="110" y="614">161-9A · REGISTERED CHASSIS, PLATES AND TRANSIT PERMITS.</text>
    <rect x="376" y="596" width="200" height="34" fill="#3d4e35"/>
    <text x="382" y="614">161-9B · DISTRICTS, CHECKPOINTS AND MAPPED ACCESS ROUTES.</text>
    <rect x="904" y="596" width="240" height="34" fill="#3d4e35"/>
    <text x="910" y="614">161-9C · STANDING, KNOWN CONTACTS AND OPEN CONTRACTS.</text>
    <rect x="1336" y="596" width="200" height="34" fill="#3d4e35"/>
    <text x="1342" y="614">161-9D · LICENSED HARDWARE AND SURPLUS COMBAT INVENTORY.</text>
  </g>

  <!-- thin build-rule at the foot (trace y 860..862), 2px in dim -->
  <rect x="0" y="860" width="1600" height="2" fill="#3d4d38"/>
</svg>