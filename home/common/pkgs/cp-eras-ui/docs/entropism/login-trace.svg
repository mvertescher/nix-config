<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- ENTROPISM login-trace: schematic of images/entropism-login.png
       (Behance 9c9903…60901b1b61cb4, #39). Source is 3840x2160; every
       coordinate here is in the 1600x900 frame (source / 2.4).

       Every coordinate below is measured, not eyeballed:
         scripts/extract_spec.py images/entropism-login.png -o /tmp/en-src.json
       plus row/column probes on the 1600-wide rescale for the outline-only
       geometry (field frame, header dividers), and the trace is held to
       the source by
         scripts/fidelity_check.sh -\-inventory entropism login

       What the source actually shows, top to bottom (read 2026-09-02 by
       opening the image and cropping into it):
         - a full-width header strip, x 49..1547, y 43..69, thin sage
           outline, dividers at x 465 and x 1353: RIPPERDOC SURGICAL
           SOFTWAREV2 / STORE ACCESS SCREEN / FLAIR TRS 5MMP (the login
           screen carries the STORE ACCESS SCREEN caption — material, not
           an error)
         - nothing else in the upper two thirds: a warm near-black ground
           with a faint radial lift, no panels, no letters, no badges
         - a lone USERNAME: label at x 578, cap top 386, baseline 403
         - a text field, thin outline, x 563..922, y 414..447, holding
           eleven masked characters (asterisks, x 579..668, centred y 430)
           with a short caret underline under the first pair at y 440,
           x 577..594
         - a filled NEXT button, x 932..1037, y 413..446 (extractor:
           [933,414,104,32]), dark NEXT label starting x 939
         - a tall SOLID sage footer band, x 36..1565, y 765..880 (extractor:
           [36,766,1529,114], 12.1% of the frame — the one large fill on
           the screen) carrying dark text along its bottom edge, baseline
           y 862: INTERFACE LOADED (x 61) / PROVIDED BY NEXUS NETWORK
           V10.8 (x 517) / BUILD 6.47.48441.R15 (x 1382). No outline box
           and no dividers — the band IS the footer on this screen, unlike
           the thin outlined strip the hub, mail and store screens use.

       Sparse by design: the shape inventory is one big fill, one small
       fill, two outline boxes and the header strip; a shapes-mode gate
       will be dominated by the footer band.

       Palette sampled by k-means over the photo (extract_spec.py):
         ink    #8aac8c (12.1%, the band + NEXT)  #739479 (outlines)
                #5b765d  #445d48  #324132  #20281c (dark text on sage)
         ground #0f0a04 (59.5%)  #1a1810 (25.7%) -->
  <defs>
    <radialGradient id="lift" cx="0.45" cy="0.4" r="0.8">
      <stop offset="0"   stop-color="#1a1810"/>
      <stop offset="0.7" stop-color="#141107"/>
      <stop offset="1"   stop-color="#0f0a04"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#lift)"/>

  <!-- ==== header strip, y 43..69, dividers at x 465 and 1353 ==== -->
  <g>
    <rect x="49" y="43" width="1498" height="26" fill="none" stroke="#739479" stroke-width="1.5"/>
    <path d="M 465,43 V 69 M 1353,43 V 69" fill="none" stroke="#739479" stroke-width="1.5"/>
    <g font-family="Rajdhani" font-size="15" fill="#8aac8c" letter-spacing="1">
      <text x="61" y="61">RIPPERDOC SURGICAL SOFTWAREV2</text>
      <text x="521" y="61">STORE ACCESS SCREEN</text>
      <text x="1382" y="61">FLAIR TRS 5MMP</text>
    </g>
  </g>

  <!-- ==== the login form: label, masked field, NEXT ==== -->
  <g font-family="Rajdhani">
    <text x="578" y="403" font-size="23" fill="#8aac8c" letter-spacing="1">USERNAME:</text>

    <!-- field, x 563..922, y 414..447 -->
    <rect x="563" y="414" width="359" height="33" fill="none" stroke="#739479" stroke-width="1.5"/>
    <text x="579" y="438" font-size="20" fill="#8aac8c" letter-spacing="2">***********</text>
    <!-- caret underline under the first pair of characters -->
    <path d="M 577,440 H 594" fill="none" stroke="#739479" stroke-width="1.5"/>

    <!-- NEXT, filled, x 932..1037, y 413..446 -->
    <rect x="932" y="413" width="105" height="33" fill="#8aac8c"/>
    <text x="939" y="435" font-size="22" fill="#20281c" letter-spacing="1">NEXT</text>
  </g>

  <!-- ==== solid footer band, x 36..1565, y 765..880 ==== -->
  <g>
    <rect x="36" y="765" width="1529" height="115" fill="#8aac8c"/>
    <g font-family="Rajdhani" font-size="15" fill="#20281c" letter-spacing="1">
      <text x="61" y="862">INTERFACE LOADED</text>
      <text x="517" y="862">PROVIDED BY NEXUS NETWORK V10.8</text>
      <text x="1382" y="862">BUILD 6.47.48441.R15</text>
    </g>
  </g>
</svg>
