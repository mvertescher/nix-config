    <rect x="520" y="320" width="270" height="360" fill="none" stroke="#5d7752" stroke-width="1"/>
    <text x="538" y="352" font-size="19" fill="#94bb94">MAGNUM 650</text>
    <text x="538" y="372" font-size="12" letter-spacing="2" fill="#3d4d38">HAND GUN</text>
