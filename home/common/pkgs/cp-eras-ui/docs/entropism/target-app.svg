    </g>
    <g font-size="12" letter-spacing="1" fill="#728f76" text-anchor="middle">
      <text x="1460" y="528">DPS</text><text x="1522" y="528">PNT</text>
      <text x="1584" y="528">ACC</text><text x="1646" y="528">ROF</text>
    </g>
    <g font-size="18" font-weight="600" fill="#94bb94" text-anchor="middle">
      <text x="1460" y="552">86</text><text x="1522" y="552">30</text>
      <text x="1584" y="552">5</text><text x="1646" y="552">5</text>
    </g>
    <g>
      <rect x="1438" y="572" width="70" height="26" fill="none" stroke="#5d7752"/>
      <rect x="1516" y="572" width="70" height="26" fill="none" stroke="#5d7752"/>
      <rect x="1594" y="572" width="70" height="26" fill="none" stroke="#5d7752"/>
      <g font-size="8" fill="#728f76" text-anchor="middle">
        <text x="1473" y="588">EMPTY SOCKET</text><text x="1551" y="588">EMPTY SOCKET</text><text x="1629" y="588">EMPTY SOCKET</text>
      </g>
    </g>
    <text x="1438" y="642" font-size="9" fill="#3d4d38">ONLY CC35 CERTIFIED AND DHSF 5TH CLASS OFFICERS ARE</text>
