<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Rajdhani">
  <!-- ENTROPISM acceptance-test screen: the 4ST STORE, tracking the
       Behance reference (the store screen in the entropism run, p1-036)
       closely enough to judge fidelity by eye: segmented top bar, sage
       monochrome store with the nav list in a plain outlined box, four
       square product cards with the selected one solid, boxed footnote
       markers, and the build-string footer.

       When this can be built from library widgets, entropism is
       feature-complete. Palette is the sampled one from
       target-components.svg. -->
  <defs>
    <linearGradient id="crt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a140c"/>
      <stop offset="45%" stop-color="#110c07"/>
      <stop offset="100%" stop-color="#0d0603"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#crt)"/>

  <!-- ===== segmented top bar ===== -->
  <g font-size="14" letter-spacing="1">
    <rect x="60" y="50" width="430" height="26" fill="none" stroke="#5d7752" stroke-width="1"/>
    <text x="74" y="68" fill="#728f76">DIGITAL DISTRIBUTION SOFTWAREV2</text>
    <rect x="494" y="50" width="1000" height="26" fill="none" stroke="#5d7752" stroke-width="1"/>
    <text x="994" y="68" fill="#728f76" text-anchor="middle">STORE ACCESS SCREEN</text>
    <rect x="1498" y="50" width="360" height="26" fill="none" stroke="#5d7752" stroke-width="1"/>
    <text x="1512" y="68" fill="#728f76">FLAIR TRS 5MMP</text>
  </g>

  <!-- ===== logotype + customer meta ===== -->
  <text x="230" y="188" font-size="54" font-weight="700" letter-spacing="2" fill="#94bb94">4S<tspan font-weight="300" fill="#5d7752">T</tspan></text>
  <text x="234" y="216" font-size="14" letter-spacing="12" fill="#728f76">S T O R E</text>

  <g font-size="13">
    <text x="230" y="252" fill="#3d4d38">CUSTOMER</text>
    <text x="430" y="252" fill="#94bb94" text-anchor="end">#NC488402</text>
    <text x="230" y="272" fill="#3d4d38">LOYALTY DISCOUNT</text>
    <text x="430" y="272" fill="#94bb94" text-anchor="end">10%</text>
    <text x="230" y="292" fill="#3d4d38">LAST UPDATE</text>
    <text x="430" y="292" fill="#94bb94" text-anchor="end">10/05/2077</text>
  </g>

  <!-- ===== nav: one plain outlined box, rows separated by rules ===== -->
  <g font-size="17" letter-spacing="1">
    <rect x="230" y="320" width="200" height="240" fill="none" stroke="#5d7752" stroke-width="1"/>
    <text x="248" y="352" fill="#94bb94">RIFLES</text>
    <path d="M230 368 h200" stroke="#3d4d38" stroke-width="1"/>
    <rect x="231" y="369" width="198" height="46" fill="#9cb795"/>
    <text x="248" y="399" fill="#1f2a1c" font-weight="600">SMG</text>
    <path d="M230 416 h200" stroke="#3d4d38" stroke-width="1"/>
    <text x="248" y="447" fill="#94bb94">SNIPER</text>
    <path d="M230 464 h200" stroke="#3d4d38" stroke-width="1"/>
    <text x="248" y="495" fill="#94bb94">SHOTGUN</text>
    <path d="M230 512 h200" stroke="#3d4d38" stroke-width="1"/>
    <text x="248" y="543" fill="#94bb94">PISTOL</text>
  </g>

  <!-- footnote markers under the nav -->
  <rect x="230" y="600" width="24" height="24" fill="none" stroke="#94bb94" stroke-width="1.2"/>
  <text x="242" y="617" font-size="14" fill="#94bb94" text-anchor="middle">A</text>
  <text x="266" y="609" font-size="9" fill="#3d4d38">SPARE TIME MANAGER WAS DEVELOPED BY SEOCHO.</text>
  <text x="266" y="620" font-size="9" fill="#3d4d38">SERVING CUSTOMERS SINCE 2006.</text>
  <rect x="230" y="644" width="24" height="24" fill="none" stroke="#94bb94" stroke-width="1.2"/>
  <text x="242" y="661" font-size="14" fill="#94bb94" text-anchor="middle">B</text>
  <text x="266" y="653" font-size="9" fill="#3d4d38">MAPS ARE PROVIDED BY SEOCHO. SATELLITE</text>
  <text x="266" y="664" font-size="9" fill="#3d4d38">SERVICES SINCE 2006.</text>

  <!-- ===== product cards ===== -->
  <!-- card 1: default -->
