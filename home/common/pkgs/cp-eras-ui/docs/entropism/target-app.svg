      <text x="838" y="612">22&#160;&#160;&#160;Spread</text>
      <text x="838" y="634">12&#160;&#160;&#160;Range</text>
      <text x="838" y="662" font-weight="700">Bonus</text>
      <text x="838" y="684">+9 Reflexes</text>
      <text x="838" y="706">+2 Modules Slots</text>
    </g>
    <g>
      <rect x="838" y="724" width="70" height="26" fill="none" stroke="#425243"/>
      <rect x="916" y="724" width="70" height="26" fill="none" stroke="#425243"/>
      <rect x="994" y="724" width="70" height="26" fill="none" stroke="#425243"/>
      <g font-size="8" fill="#425243" text-anchor="middle">
        <text x="873" y="740">EMPTY SOCKET</text><text x="951" y="740">EMPTY SOCKET</text><text x="1029" y="740">EMPTY SOCKET</text>
      </g>
    </g>
  </g>

  <!-- card 3: default -->
  <g>
    <rect x="1120" y="320" width="270" height="360" fill="none" stroke="#5d7752" stroke-width="1"/>
    <text x="1138" y="352" font-size="19" fill="#94bb94">MAGNUM 650</text>
    <text x="1138" y="372" font-size="12" letter-spacing="2" fill="#3d4d38">HAND GUN</text>
    <path d="M1138 382 h234" stroke="#3d4d38" stroke-width="1"/>
    <g stroke="#94bb94" stroke-width="2" fill="none">
      <path d="M1160 424 h130 l16 10 h26 v16 h-32 l-10 12 h-76 l-9 -10 h-45 Z"/>
      <path d="M1196 462 v18 h16 v-18"/>
    </g>
    <g font-size="12" letter-spacing="1" fill="#728f76" text-anchor="middle">
      <text x="1160" y="528">DPS</text><text x="1222" y="528">PNT</text>
      <text x="1284" y="528">ACC</text><text x="1346" y="528">ROF</text>
