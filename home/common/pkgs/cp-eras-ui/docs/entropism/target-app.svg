      <text x="684" y="528">ACC</text><text x="746" y="528">ROF</text>
    </g>
    <g font-size="18" font-weight="600" fill="#94bb94" text-anchor="middle">
      <text x="560" y="552">86</text><text x="622" y="552">30</text>
      <text x="684" y="552">5</text><text x="746" y="552">5</text>
    </g>
    <g>
