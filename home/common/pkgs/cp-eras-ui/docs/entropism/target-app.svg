    <text x="1138" y="642" font-size="9" fill="#3d4d38">ONLY CC35 CERTIFIED AND DHSF 5TH CLASS OFFICERS ARE</text>
    <text x="1138" y="654" font-size="9" fill="#3d4d38">ALLOWED TO MANIPULATE, ACCESS OR DISABLE THIS DEVICE.</text>
  </g>

  <!-- card 4: default -->
  <g>
    <rect x="1420" y="320" width="270" height="360" fill="none" stroke="#5d7752" stroke-width="1"/>
    <text x="1438" y="352" font-size="19" fill="#94bb94">MAGNUM 650</text>
    <text x="1438" y="372" font-size="12" letter-spacing="2" fill="#3d4d38">HAND GUN</text>
