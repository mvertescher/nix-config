    <text x="538" y="642" font-size="9" fill="#3d4d38">ONLY CC35 CERTIFIED AND DHSF 5TH CLASS OFFICERS ARE</text>
    <text x="538" y="654" font-size="9" fill="#3d4d38">ALLOWED TO MANIPULATE, ACCESS OR DISABLE THIS DEVICE.</text>
  </g>

