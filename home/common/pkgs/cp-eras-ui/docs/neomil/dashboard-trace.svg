<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- NEOMIL dashboard-trace: schematic of images/img-07-dashboard.png
       (Behance 3fc4ef118663901.60e5fa6a7f2f7, 3840x2160 photo).

       Every coordinate below is measured, not eyeballed:
         scripts/extract_spec.py images/img-07-dashboard.png -o /tmp/src.json
       and the trace is held to the source by
         scripts/spec_diff.py /tmp/src.json /tmp/trace.json

       What the source actually shows, top to bottom:
         - no hard-edged top band; a broad blue glow over near-black, peaking
           around x 300-700 at full height and gone by y~420, with a warm
           near-black vignette down the left margin
         - header row: CUSTOMER + one chamfered LEVEL T1 badge at the left,
           the "next TECHNOLOGY" logotype with a code tape under it, and
           SECURITY LEVEL + FOUR chamfered LEVEL badges at the right, the
           second of which is filled (selected)
         - a full-width hairline rule at y=187, x 42..1558
         - a tab row at y=237: COMPUTER SYSTEMS centre, DESCRIPTION right,
           and a small chip marker at each margin
         - THE MENU IS SIX DIAMONDS in a staggered 3+3 lattice, half-diagonal
           104 (the four unoccluded side tips read 102.2..104.6 on the
           photo, half-maximum mean 103.7; inside the glow blur, so 104
           is used here and in the cells alike), centres (334,460) (530,460)
           (725,460) / (431,593) (628,592) (822,592) — x pitch 195.5, row
           pitch 132..133, row 2 offset +97 (97, 98, 97 as drawn).
           EVERY OUTWARD TIP IS CUT FLAT: row 1's three top tips end in a
           30px plateau at y 371 (photo 370.8..371.2, plateau 29..31 wide:
           x 320..349, 516..545, 711..740), row 2's three bottom tips at
           y 682..683 (photo 682.1..682.9, plateau 27.5..31 wide) — a 104
           half-diagonal cut 15 short, i.e. flat at 89 from the centre.
           The inward tips run full (row 1 bottoms at 563.3, row 2 tops at
           490.4: 103 from the centre). Re-measured 2026-09-03, column and
           row scans of the 3840px photo.
           Each carries a thin inset diamond outline at half-diagonal 68
           (edge fits 65.5..69) truncated the same way, flat at 59 from the
           centre (photo 58.3 row 1, 59.6 row 2; an 18px plateau), and a
           glyph at its centre; neighbours overlap by ~10px and are held
           apart by a dark separator, drawn here as a background-coloured
           bar. Labels sit above row 1 and below row 2.
         - a GO HOME info panel at x 1128..1366, y 314..756. Pixel scans
           of the 1600 downscale (2026-09-02): the top-left and
           bottom-right corners are SQUARE; the top-right is chamfered 8
           ((1358,314)->(1366,322)) and the bottom-left 42
           ((1128,714)->(1170,756)). The right edge sits at x 1366 from
           the chamfer down to a filled bar x 1358..1366, y 405..516,
           chamfered 8 at both ends ((1366,405)->(1358,414) and
           (1366,508)->(1358,516); re-scanned 2026-09-03, the bottom is
           not "nearly flat"), and steps 8px inward to x 1358 below the
           bar - the same bar-and-step motif as the store cards. Faint glitch
           echoes of the edge sit 3 and 5px to its right; no scrollbar.
           A maker's mark at its foot
         - rotated micro-text down both margins, and a two-cell OUTLINED
           footer tape x 1209..1354, y 864..888 (bright 1px frame, divider
           at x 1270.5; a code in the left cell, two lines of micro-text in
           the right), with a dim glitch echo 3px right and down that
           reaches x ~1358. Re-read 2026-09-03: the earlier two filled
           cells were the extractor's blobs, not the picture

       Corrects the previous revision of this file, which drew three red
       chart cards, a right rail and a corner block. None of those are in
       the photo; that trace was written without reading the image and
       still scored 0.560 layout on compare_ref.py, which is why
       scripts/spec_diff.py now gates on the shape inventory instead.

       Palette sampled by k-means over the photo (extract_spec.py):
         ink   #ef3333 (9.0%)  #ae272b (1.1%)  #671b21 (2.1%)
         ground #070304 (38.8%) #14244e (18.3%) #1e0d0e (15.3%)
                #0f1f2b (9.3%)  #2d3149 (6.1%) -->
  <defs>
    <!-- The blue is not a band with an edge. Horizontally it is sampled from
         the photo at y=90; vertically it holds to y~250 and is gone by y~430,
         so the horizontal ramp is masked by a vertical fade rather than
         clipped to a rectangle. -->
    <linearGradient id="glowh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.000" stop-color="#282824"/>
      <stop offset="0.063" stop-color="#273743"/>
      <stop offset="0.188" stop-color="#263953"/>
      <stop offset="0.313" stop-color="#202b56"/>
      <stop offset="0.438" stop-color="#1b2253"/>
      <stop offset="0.563" stop-color="#171f51"/>
      <stop offset="0.688" stop-color="#121f51"/>
      <stop offset="0.813" stop-color="#0d1f4e"/>
      <stop offset="0.938" stop-color="#082447"/>
      <stop offset="1.000" stop-color="#080b0e"/>
    </linearGradient>
    <!-- stops read off the source's blue channel at x=1000, normalised -->
    <linearGradient id="glowv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#ffffff"/>
      <stop offset="0.30" stop-color="#e3e3e3"/>
      <stop offset="0.35" stop-color="#bababa"/>
      <stop offset="0.40" stop-color="#8c8c8c"/>
      <stop offset="0.45" stop-color="#545454"/>
      <stop offset="0.50" stop-color="#2b2b2b"/>
      <stop offset="0.55" stop-color="#121212"/>
      <stop offset="0.60" stop-color="#000000"/>
    </linearGradient>
    <mask id="glowmask">
      <rect width="1600" height="900" fill="url(#glowv)"/>
    </mask>
    <radialGradient id="vignette" cx="0.02" cy="0.60" r="0.34">
      <stop offset="0" stop-color="#241012"/>
      <stop offset="1" stop-color="#241012" stop-opacity="0"/>
    </radialGradient>

    <!-- One menu cell, two variants. Half-diagonal 104, measured off the
         unoccluded side tips (D1 and D4 left, D3 and D6 right: 102.2..104.6
         by solid fill, 103.7 mean by half-maximum). The OUTWARD tip is cut
         flat at 89 from the centre (photo: row 1 tops 370.8..371.2, row 2
         bottoms 682.1..682.9), leaving a 30px plateau; the inward tip runs
         full. The inset outline (half-diagonal 68, stroke 2) is cut the
         same way, flat at 59 (photo 58.3 / 59.6), an 18px plateau.
         #cell-up is row 1 (top cut), #cell-down is row 2 (bottom cut);
         each is the other mirrored in y. Coordinates are explicit so the
         two shapes transcribe straight to path primitives: no clip.
         The diamonds are NOT outlined, and only same-row neighbours
         overlap at all — L1 distance 195.5 against a diameter of 208, so
         the rows merely interlock and never touch. The 16px dark gap the
         source shows between same-row neighbours is drawn separately as a
         bar on the midpoint, which is where it measures. -->
    <g id="cell-up">
      <path d="M -15,-89 L 15,-89 L 104,0 L 0,104 L -104,0 Z" fill="#ef3333"/>
      <path d="M -9,-59 L 9,-59 L 68,0 L 0,68 L -68,0 Z"
            fill="none" stroke="#671b21" stroke-width="2"/>
      <rect x="-22" y="-21" width="43" height="36" fill="#671b21"/>
    </g>
    <g id="cell-down">
      <path d="M 0,-104 L 104,0 L 15,89 L -15,89 L -104,0 Z" fill="#ef3333"/>
      <path d="M 0,-68 L 68,0 L 9,59 L -9,59 L -68,0 Z"
            fill="none" stroke="#671b21" stroke-width="2"/>
      <rect x="-22" y="-21" width="43" height="36" fill="#671b21"/>
    </g>
    <!-- header badge: 59x57, bottom-left chamfer 15 -->
    <path id="badge" d="M 0,0 H 59 V 57 H 15 L 0,42 Z"/>
  </defs>

  <rect width="1600" height="900" fill="#070304"/>
  <rect width="1600" height="900" fill="url(#glowh)" mask="url(#glowmask)"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <!-- ==== header ==== -->
  <g font-family="Rajdhani" fill="#ef3333">
    <text x="109" y="90" font-size="14" letter-spacing="1.5">CUSTOMER</text>
    <use href="#badge" x="117" y="104" fill="#671b21" stroke="#ef3333" stroke-width="1.5"/>
    <text x="125" y="121" font-size="12" fill="#ef3333">LEVEL</text>
    <text x="132" y="140" font-size="20" font-weight="700">T1</text>

    <text x="240" y="90" font-size="14" letter-spacing="1.5">#NC488402</text>
    <!-- "next" logotype block, x 242..389, y 96..141 -->
    <text x="242" y="132" font-size="42" font-family="Orbitron" font-weight="700"
          fill="none" stroke="#ef3333" stroke-width="2">next</text>
    <!-- code tape under the logotype, chamfered both bottom corners -->
    <path d="M 257,151 H 379 V 158 L 377,160 H 259 L 257,158 Z" fill="#ef3333"/>

    <text x="1125" y="90" font-size="14" letter-spacing="1.5">SECURITY LEVEL</text>
    <g>
      <use href="#badge" x="1133" y="104" fill="#671b21" stroke="#ef3333" stroke-width="1.5"/>
      <use href="#badge" x="1193" y="104" fill="#ae272b" stroke="#ef3333" stroke-width="1.5"/>
      <use href="#badge" x="1253" y="104" fill="#671b21" stroke="#ef3333" stroke-width="1.5"/>
      <use href="#badge" x="1313" y="104" fill="#671b21" stroke="#ef3333" stroke-width="1.5"/>
      <g font-size="12">
        <text x="1141" y="121">LEVEL</text><text x="1201" y="121">LEVEL</text>
        <text x="1261" y="121">LEVEL</text><text x="1321" y="121">LEVEL</text>
      </g>
      <g font-size="20" font-weight="700">
        <text x="1148" y="140">T1</text><text x="1208" y="140">T2</text>
        <text x="1268" y="140">T3</text><text x="1328" y="140">T4</text>
      </g>
    </g>
  </g>

  <!-- full-width hairline rule, measured y=187 x 42..1558 -->
  <rect x="42" y="187" width="1516" height="2" fill="#ae272b"/>

  <!-- ==== tab row, y 237..258 ==== -->
  <g font-family="Rajdhani" font-size="12" letter-spacing="1.2">
    <rect x="27" y="240" width="55" height="17" fill="#671b21" stroke="#ef3333"/>
    <rect x="475" y="237" width="211" height="21" fill="#671b21" stroke="#ae272b"/>
    <text x="515" y="252" fill="#ef3333">COMPUTER SYSTEMS</text>
    <path d="M 1139,237 H 1354 V 258 H 1139 L 1132,251 V 244 Z"
          fill="#671b21" stroke="#ae272b"/>
    <text x="1145" y="252" fill="#ef3333">DESCRIPTION</text>
    <rect x="1516" y="239" width="54" height="17" fill="#671b21" stroke="#ef3333"/>
  </g>

  <!-- ==== the six-diamond menu ==== -->
  <g>
    <!-- row 1: tops cut flat at y 371; row 2: bottoms cut flat at y 682/681 -->
    <use href="#cell-up" x="334" y="460"/>
    <use href="#cell-up" x="530" y="460"/>
    <use href="#cell-up" x="725" y="460"/>
    <use href="#cell-down" x="431" y="593"/>
    <use href="#cell-down" x="628" y="592"/>
    <use href="#cell-down" x="822" y="592"/>
    <!-- separators: 16px wide on the midpoint of each same-row pair, which
         is where the source's gaps measure (424..439 and 620..635 at y=460) -->
    <g fill="#070304">
      <rect x="424"   y="445" width="16" height="30"/>
      <rect x="619.5" y="445" width="16" height="30"/>
      <rect x="521.5" y="577" width="16" height="30"/>
      <rect x="717"   y="577" width="16" height="30"/>
    </g>
  </g>
  <g font-family="Rajdhani" font-size="19" font-weight="600" fill="#ef3333"
     text-anchor="middle" letter-spacing="1.2">
    <text x="334" y="347">VEHICLES</text>
    <text x="530" y="347">LOCATIONS</text>
    <text x="725" y="347">FACTIONS</text>
    <text x="431" y="721">WEAPONS</text>
    <text x="628" y="721">PRODUCTS</text>
    <text x="822" y="721">CORPORATIONS</text>
  </g>

  <!-- ==== GO HOME info panel, x 1128..1366, y 314..756 ==== -->
  <g>
    <path d="M 1128,314 H 1358 L 1366,322 V 508 L 1358,516 V 756 H 1170 L 1128,714 Z"
          fill="#671b21" fill-opacity="0.55" stroke="#ef3333" stroke-width="1.5"/>
    <!-- the bright bar on the right edge, y 405..516, chamfered 8 at both ends -->
    <path d="M 1366,405 V 508 L 1358,516 V 414 Z" fill="#ef3333"/>
    <!-- glitch echoes of the right edge, 3px and 5px out, above and below the bar -->
    <g fill="#671b21">
      <rect x="1369" y="322" width="1.5" height="193"/>
      <rect x="1371" y="322" width="1.5" height="193"/>
      <rect x="1361" y="516" width="1.5" height="240"/>
      <rect x="1363" y="516" width="1.5" height="240"/>
    </g>
    <text x="1140" y="333" font-family="Rajdhani" font-size="20" font-weight="700"
          fill="#ef3333">GO HOME</text>
    <!-- body copy: five lines, blank, four lines (measured run boxes) -->
    <g fill="#ae272b">
      <rect x="1140" y="368" width="202" height="12"/>
      <rect x="1140" y="389" width="215" height="12"/>
      <rect x="1140" y="410" width="197" height="12"/>
      <rect x="1140" y="431" width="121" height="12"/>
      <rect x="1140" y="474" width="205" height="12"/>
      <rect x="1140" y="495" width="216" height="12"/>
      <rect x="1140" y="516" width="186" height="12"/>
      <rect x="1140" y="537" width="193" height="12"/>
    </g>
    <!-- maker's mark at the foot -->
    <path d="M 1208,722 V 683 h 11 l 12 18 12,-18 h 11 v 39 h -11 v -20 l -12,16 -12,-16 v 20 Z"
          fill="#ef3333"/>
    <rect x="1208" y="731" width="89" height="8" fill="#671b21"/>
  </g>

  <!-- ==== margins: rotated micro-text down both sides ==== -->
  <g fill="#671b21">
    <rect x="33" y="463" width="8" height="113"/>
    <rect x="1533" y="527" width="8" height="238"/>
    <rect x="1348" y="341" width="4" height="49"/>
  </g>

  <!-- ==== footer tape, x 1209..1354, y 864..888: two outlined cells ====
       Frame and divider are the bright ink at ~1px (photo 1209.2, 1270.0..
       1271.2, 1353.8; 863.8..865.0 and 887.1..888.3); the cells are NOT
       filled. Left cell: one code line, cap-height ~6 at y 869..875,
       x 1215..1264. Right cell: two lines of micro-text, y 869..874 and
       877..882, x 1277..1345. A dim echo of the frame sits 3px right and
       down, which is what reaches x ~1358. -->
  <g>
    <rect x="1212.5" y="867.5" width="144" height="24" fill="none"
          stroke="#671b21" stroke-width="1"/>
    <rect x="1209.5" y="864.5" width="144" height="24" fill="none"
          stroke="#ef3333" stroke-width="1"/>
    <rect x="1270" y="864.5" width="1.2" height="24" fill="#ef3333"/>
    <g font-family="Rajdhani" font-size="8" font-weight="700" fill="#ef3333">
      <text x="1215" y="875">68SD1D1100D1S</text>
      <g font-size="7.5" font-weight="600">
        <text x="1277" y="874">COMBAT COLONIZATION</text>
        <text x="1277" y="882">DEFENCE PROGRAM</text>
      </g>
    </g>
  </g>
</svg>
