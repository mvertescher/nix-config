<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- NEOMIL login-trace: schematic of images/img-06-private.png
       (Behance 6cfb20118663901.60901b2225a24, 3840x2160 photo).

       Every coordinate below is measured, not eyeballed:
         scripts/extract_spec.py images/img-06-private.png -o /tmp/nm-src.json
       plus row/column scans of the 1600x900 downscale for the edges the
       fitter split (card chamfers, the left-edge notches, the avatar
       boxes), and the trace is held to the source by
         scripts/fidelity_check.sh - -inventory neomil login

       What the source actually shows, top to bottom (read from the photo
       and from 2x crops of every region, 2026-09-02):
         - the same backdrop as the hub screen: a broad blue glow over
           near-black, gone by y~420, warm near-black vignette down the
           left margin. The y=90 samples are identical to img-07's, so the
           gradient stops are the ones measured there.
         - header row, identical in layout to the hub: CUSTOMER + one
           chamfered LEVEL T1 badge at the left; #NC488402 over a
           PROTOCOL 6520-A44 barcode block with four lines of micro-text
           beside it and a filled code tape "JHN 102 CKC 151 CC10 AS5"
           under it; SECURITY LEVEL + FOUR chamfered LEVEL badges at the
           right, the second (T2) filled
         - a full-width hairline rule at y=188, x 42..1558
         - margin markers: a small "1" chip at x 60..72 y 347..359 (left)
           and a "2" chip at x 1542..1556 (right), each with a dot and
           dashes to its left; rotated micro-text down both margins
           ("00032 05 54 08 CP" left; a down-arrow, "JHN 102 CKC 151 CC10
           AS5" and "KIROSHI" right)
         - THREE USER CARDS in a row, 253..255 wide as drawn below (the
           photo reads 253.3 for all three), tops at y 313..315,
           each with a 51px top-right chamfer and a dark notch cut into
           its left edge at y 390..496 (15px deep; the ends are cut at
           ~45 degrees, 15 tall at the top and 13 at the bottom). Both
           numbers re-measured on the 3840px photo 2026-09-03: the
           chamfer reads 50.8..52.1 on the three cards (this file had
           46, a miss, not a rounding); the notch depth reads 14.8, 15.2,
           15.0 (this prose had 14 against a path that drew 15):
             card 1 (x 372..625): the ACTIVE one. A solid #f63333 block
               y 313..572 holding a darker avatar box x 452..546
               y 386..487 (tab at top-left, hexagon glyph inside) and
               USER 01 in dark ink; then "password:", a dark password
               field x 372..625 y 602..634 with "**********  __", a
               filled Login button y 635..683 (bottom-right chamfer 9)
               with a text caret, and two lines of caption micro-text
             card 2 (x 692..947, y 315..655): dim translucent red,
               bottom-left chamfer 22, a bright avatar photo box
               x 772..868 (tab + square), USER 01 in bright ink, a
               separator at y 569 with a darker lower section carrying
               the two caption lines
             card 3 (x 982..1236, y 315..655): the same card, darker
               still (the "protected" state)
         - nothing below y 720 but ground

       Palette sampled by k-means over the photo (extract_spec.py):
         ink   #f63333 (4.4%)  #ae2729 (1.8%)  #691d21 (4.4%)
               #420f10 (6.2%)  #4f2734 (2.2%)
         ground #080405 (44.6%) #16274c (25.7%) #16181e (10.5%)
       Point samples used for the card fills, which are translucent over
       the blue and grade darker downward: card 2 #74272c -> #5e1516,
       lower section #461012; card 3 #52242c -> #481012, lower #2f0b0c;
       avatar box on card 1 #c72a2b; password
       field #430e0f; Login button #a52223. -->
  <defs>
    <linearGradient id="glowh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.000" stop-color="#282824"/>
      <stop offset="0.063" stop-color="#273743"/>
      <stop offset="0.188" stop-color="#263953"/>
      <stop offset="0.313" stop-color="#202b56"/>
      <stop offset="0.438" stop-color="#1b2253"/>
      <stop offset="0.563" stop-color="#171f51"/>
      <stop offset="0.688" stop-color="#121f51"/>
      <stop offset="0.813" stop-color="#0d1f4e"/>
      <stop offset="0.938" stop-color="#082447"/>
      <stop offset="1.000" stop-color="#080b0e"/>
    </linearGradient>
    <linearGradient id="glowv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#ffffff"/>
      <stop offset="0.30" stop-color="#e3e3e3"/>
      <stop offset="0.35" stop-color="#bababa"/>
      <stop offset="0.40" stop-color="#8c8c8c"/>
      <stop offset="0.45" stop-color="#545454"/>
      <stop offset="0.50" stop-color="#2b2b2b"/>
      <stop offset="0.55" stop-color="#121212"/>
      <stop offset="0.60" stop-color="#000000"/>
    </linearGradient>
    <mask id="glowmask">
      <rect width="1600" height="900" fill="url(#glowv)"/>
    </mask>
    <radialGradient id="vignette" cx="0.02" cy="0.60" r="0.34">
      <stop offset="0" stop-color="#241012"/>
      <stop offset="1" stop-color="#241012" stop-opacity="0"/>
    </radialGradient>
    <!-- card fills, sampled down the card centre: translucent over the
         backdrop, so lighter and bluer at the top than at the foot -->
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74272c"/>
      <stop offset="1" stop-color="#5e1516"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52242c"/>
      <stop offset="1" stop-color="#481012"/>
    </linearGradient>
    <!-- header badge: 59x57, bottom-left chamfer 15 (same as the hub) -->
    <path id="badge" d="M 0,0 H 59 V 57 H 15 L 0,42 Z"/>
    <!-- the notch every card carries on its left edge: 15 deep, y 390..496,
         chamfered top and bottom (column scans across cards 2 and 3 at
         photo scale, 2026-09-03: outer 389.7..496.0, inner 405..483) -->
    <path id="notch" d="M 0,390 L 15,405 V 483 L 0,496 Z"/>
    <!-- margin chip: dashes, a dot, a filled square with a digit -->
    <g id="chip">
      <rect x="-21" y="3" width="8" height="1.5"/>
      <rect x="-21" y="7" width="6" height="1.5"/>
      <rect x="-11" y="3" width="6" height="6"/>
      <rect x="0" y="0" width="14" height="14"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#080405"/>
  <rect width="1600" height="900" fill="url(#glowh)" mask="url(#glowmask)"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <!-- ==== header ==== -->
  <g font-family="Rajdhani" fill="#f63333">
    <text x="124" y="90" font-size="14" letter-spacing="1.5">CUSTOMER</text>
    <use href="#badge" x="117" y="104" fill="#691d21" stroke="#f63333" stroke-width="1.5"/>
    <text x="125" y="121" font-size="12">LEVEL</text>
    <text x="132" y="140" font-size="20" font-weight="700">T1</text>

    <text x="256" y="90" font-size="14" letter-spacing="1.5">#NC488402</text>
    <!-- PROTOCOL block x 257..300, y 106..141: four rows of barcode dashes
         over two lines of bold micro-text -->
    <g fill="#ae2729">
      <rect x="257" y="107" width="18" height="2.5"/><rect x="279" y="107" width="21" height="2.5"/>
      <rect x="257" y="111" width="26" height="2.5"/><rect x="287" y="111" width="13" height="2.5"/>
      <rect x="257" y="115" width="12" height="2.5"/><rect x="273" y="115" width="27" height="2.5"/>
      <rect x="257" y="119" width="22" height="2.5"/><rect x="283" y="119" width="17" height="2.5"/>
    </g>
    <text x="257" y="131" font-size="9" font-weight="700" letter-spacing="1.2">PROTOCOL</text>
    <text x="257" y="141" font-size="9" font-weight="700" letter-spacing="1.2">6520-A44</text>
    <g font-size="6.5" fill="#ae2729">
      <text x="305" y="108">ONLY CC35 CERTIFIED</text>
      <text x="305" y="116.5">AND DHSF 5TH CLASS OFFICERS</text>
      <text x="305" y="125">ARE ALLOWED TO MANIPULATE,</text>
      <text x="305" y="133.5">ACCESS OR DISABLE THIS DEVICE.</text>
    </g>
    <!-- code tape under the block, x 257..376 y 151..160, filled, dark text -->
    <path d="M 259,151 H 376 V 160 H 259 L 257,158 V 153 Z" fill="#f63333"/>
    <g fill="#420f10">
      <rect x="261" y="153" width="1.5" height="5"/><rect x="264" y="153" width="1" height="5"/>
      <rect x="267" y="153" width="2" height="5"/><rect x="271" y="153" width="1" height="5"/>
      <rect x="274" y="153" width="1.5" height="5"/>
      <text x="283" y="158" font-size="7" letter-spacing="0.6">JHN 102 CKC 151 CC10 AS5</text>
    </g>

    <text x="1141" y="90" font-size="14" letter-spacing="1.5">SECURITY LEVEL</text>
    <g>
      <use href="#badge" x="1133" y="104" fill="#691d21" stroke="#f63333" stroke-width="1.5"/>
      <use href="#badge" x="1193" y="104" fill="#ae2729" stroke="#f63333" stroke-width="1.5"/>
      <use href="#badge" x="1253" y="104" fill="#691d21" stroke="#f63333" stroke-width="1.5"/>
      <use href="#badge" x="1313" y="104" fill="#691d21" stroke="#f63333" stroke-width="1.5"/>
      <g font-size="12">
        <text x="1141" y="121">LEVEL</text><text x="1201" y="121">LEVEL</text>
        <text x="1261" y="121">LEVEL</text><text x="1321" y="121">LEVEL</text>
      </g>
      <g font-size="20" font-weight="700">
        <text x="1148" y="140">T1</text><text x="1208" y="140">T2</text>
        <text x="1268" y="140">T3</text><text x="1328" y="140">T4</text>
      </g>
    </g>
  </g>

  <!-- full-width hairline rule, measured y=188 x 42..1558 -->
  <rect x="42" y="188" width="1516" height="1.5" fill="#ae2729"/>

  <!-- ==== margins ==== -->
  <g font-family="Rajdhani" font-size="11" letter-spacing="1">
    <use href="#chip" x="60" y="346" fill="#f63333"/>
    <text x="63" y="357" font-size="10" font-weight="700" fill="#420f10">1</text>
    <text transform="translate(57,472) rotate(-90)" fill="#ae2729">00032 05 54 08 CP</text>

    <use href="#chip" x="1542" y="346" fill="#f63333"/>
    <text x="1545" y="357" font-size="10" font-weight="700" fill="#420f10">2</text>
    <!-- down-arrow glyph x 1546..1552 y 410..434, dashes beside it -->
    <rect x="1548" y="410" width="2" height="18" fill="#f63333"/>
    <path d="M 1544,426 H 1554 L 1549,434 Z" fill="#f63333"/>
    <rect x="1555" y="412" width="1.5" height="4" fill="#ae2729"/>
    <rect x="1555" y="419" width="1.5" height="4" fill="#ae2729"/>
    <text transform="translate(1556,554) rotate(-90)" fill="#ae2729">JHN 102 CKC 151 CC10 AS5</text>
    <text transform="translate(1556,651) rotate(-90)" fill="#ae2729">KIROSHI</text>
  </g>

  <!-- ==== card 1: the active user, x 372..625 ==== -->
  <g>
    <!-- solid red block y 313..572, top-right chamfer 51 -->
    <path d="M 372,313 H 574 L 625,364 V 572 H 372 Z" fill="#f63333"/>
    <use href="#notch" x="372" fill="#080405"/>
    <rect x="372" y="390" width="1.5" height="106" fill="#ae2729"/>
    <!-- avatar box: tab x 452..498 y 386..393 over a square y 393..487 -->
    <path d="M 452,386 H 492 L 498,393 H 452 Z" fill="#c72a2b"/>
    <rect x="452" y="393" width="94" height="94" fill="#c72a2b"/>
    <!-- the hexagon glyph and its satellites, dark on the box -->
    <g fill="none" stroke="#200506" stroke-width="3">
      <path d="M 508,410 L 528,421 V 445 L 508,456 L 488,445 V 421 Z"/>
      <path d="M 492,449 L 524,417" stroke-width="4"/>
    </g>
    <g fill="#200506">
      <rect x="456" y="402" width="14" height="1.5"/><rect x="456" y="406" width="12" height="1.5"/>
      <rect x="456" y="410" width="14" height="1.5"/><rect x="456" y="414" width="10" height="1.5"/>
      <rect x="456" y="470" width="6" height="7"/>
      <circle cx="470" cy="474" r="3"/>
      <rect x="484" y="468" width="12" height="12" fill="none" stroke="#200506" stroke-width="2"/>
      <path d="M 484,468 L 496,480" stroke="#200506" stroke-width="2"/>
      <rect x="499" y="468" width="3" height="3"/><rect x="499" y="473" width="3" height="3"/>
    </g>
    <text x="499" y="530" font-family="Rajdhani" font-size="18" letter-spacing="1.5"
          text-anchor="middle" fill="#420f10">USER 01</text>

    <text x="378" y="595" font-family="Rajdhani" font-size="14" fill="#f63333">password:</text>
    <!-- password field y 602..634 -->
    <rect x="372.5" y="602.5" width="252" height="32" fill="#430e0f" stroke="#ae2729" stroke-width="1"/>
    <text x="381" y="626" font-family="Rajdhani" font-size="12" letter-spacing="3" fill="#f63333">**********  __</text>
    <!-- Login button y 635..683, bottom-right chamfer 9 -->
    <path d="M 372,635 H 625 V 674 L 616,683 H 372 Z" fill="#a52223"/>
    <text x="383" y="657" font-family="Rajdhani" font-size="17" fill="#420f10">Login</text>
    <rect x="496" y="640" width="2" height="15" fill="#420f10"/>
    <g font-family="Rajdhani" font-size="7.5" fill="#e63132">
      <text x="378" y="700">ONLY CC35 CERTIFIED AND DHSF 5TH CLASS OFFICERS ARE ALLOWED TO</text>
      <text x="378" y="709">MANIPULATE, ACCESS OR DISABLE THIS DEVICE.</text>
    </g>
  </g>

  <!-- ==== card 2, x 692..947 y 315..655 ==== -->
  <g>
    <path d="M 692,315 H 896 L 947,366 V 655 H 714 L 692,633 Z"
          fill="url(#card2)" stroke="#ae2729" stroke-width="1.5"/>
    <path d="M 692,569 H 947 V 655 H 714 L 692,633 Z" fill="#461012"/>
    <use href="#notch" x="692" fill="#080405"/>
    <rect x="692" y="390" width="1.5" height="106" fill="#ae2729"/>
    <!-- avatar photo: tab + bright square, portrait dark -->
    <path d="M 772,386 H 818 L 824,393 H 772 Z" fill="#f63333"/>
    <rect x="772" y="393" width="96" height="94" fill="#f63333"/>
    <!-- portrait silhouette: hair/face mass x 800..852 y 398..452, shoulders
         to the foot of the box -->
    <g fill="#4f1a1e">
      <ellipse cx="823" cy="431" rx="16" ry="21"/>
      <path d="M 803,420 Q 806,398 826,398 Q 850,400 852,426 L 850,458 L 838,446 L 840,414 Q 828,406 814,418 L 812,446 L 800,452 Z"/>
      <path d="M 788,487 L 794,464 Q 823,448 852,464 L 858,487 Z"/>
    </g>
    <text x="821" y="530" font-family="Rajdhani" font-size="18" letter-spacing="1.5"
          text-anchor="middle" fill="#f63333">USER 01</text>
    <rect x="692" y="568.5" width="255" height="1" fill="#ae2729"/>
    <g font-family="Rajdhani" font-size="7.5" fill="#e63132">
      <text x="699" y="587">ONLY CC35 CERTIFIED AND DHSF 5TH CLASS OFFICERS ARE ALLOWED TO</text>
      <text x="699" y="596">MANIPULATE, ACCESS OR DISABLE THIS DEVICE.</text>
    </g>
  </g>

  <!-- ==== card 3, x 982..1236 y 315..655: the same card, darker ==== -->
  <g>
    <path d="M 982,315 H 1185 L 1236,366 V 655 H 1004 L 982,633 Z"
          fill="url(#card3)" stroke="#8a2027" stroke-width="1.5"/>
    <path d="M 982,569 H 1236 V 655 H 1004 L 982,633 Z" fill="#2f0b0c"/>
    <use href="#notch" x="982" fill="#080405"/>
    <rect x="982" y="390" width="1.5" height="106" fill="#8a2027"/>
    <path d="M 1061,386 H 1107 L 1113,393 H 1061 Z" fill="#f63333"/>
    <rect x="1061" y="393" width="96" height="94" fill="#f63333"/>
    <g fill="#4f1a1e">
      <ellipse cx="1112" cy="431" rx="16" ry="21"/>
      <path d="M 1092,420 Q 1095,398 1115,398 Q 1139,400 1141,426 L 1139,458 L 1127,446 L 1129,414 Q 1117,406 1103,418 L 1101,446 L 1089,452 Z"/>
      <path d="M 1077,487 L 1083,464 Q 1112,448 1141,464 L 1147,487 Z"/>
    </g>
    <text x="1110" y="530" font-family="Rajdhani" font-size="18" letter-spacing="1.5"
          text-anchor="middle" fill="#f63333">USER 01</text>
    <rect x="982" y="568.5" width="254" height="1" fill="#8a2027"/>
    <g font-family="Rajdhani" font-size="7.5" fill="#ae2729">
      <text x="989" y="587">ONLY CC35 CERTIFIED AND DHSF 5TH CLASS OFFICERS ARE ALLOWED TO</text>
      <text x="989" y="596">MANIPULATE, ACCESS OR DISABLE THIS DEVICE.</text>
    </g>
  </g>
</svg>
