<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Rajdhani">
  <!-- NEOMIL DASHBOARD — ground truth: tests/golden/dashboard-neomil-1600x900.png
       Layout per src/screens/dashboard.rs Layout::OpsCharts arm +
       widgets/charts.rs, fractions of docs/neomil/dashboard-trace.svg.
       Palette: bg #050304, band #2a3a51 -> #101f3d (BAND_TOP/BAND_BOTTOM),
       crests/border #a32226/#5e1112, cards/select #de2e2e, trim #350e10
       (CARD_DARK), slits/ink #1a0405 (on-select), wordmark #dedede. -->
  <defs>
    <linearGradient id="topband" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a3a51"/>
      <stop offset="0.55" stop-color="#24364f"/>
      <stop offset="1" stop-color="#101f3d"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#050304"/>

  <!-- full-width cold-blue top band (trace rows 0-2, y 0..172) -->
  <rect x="0" y="0" width="1600" height="172" fill="url(#topband)"/>

  <!-- crest blocks on the band -->
  <rect x="240" y="112" width="160" height="58" fill="#a32226"/>
  <rect x="1150" y="112" width="152" height="58" fill="#a32226"/>

  <!-- the band wordmark, centred between the crests -->
  <text x="800" y="151" font-size="32" fill="#dedede" text-anchor="middle">OPS DASHBOARD</text>

  <!-- dark left margin (background zone, not a sidebar) -->
  <rect x="0" y="172" width="190" height="728" fill="#1a0405"/>
  <!-- mid-left blue zone under the band -->
  <rect x="300" y="172" width="830" height="226" fill="#101f3d"/>

  <!-- three chart cards: chamfered bottom-right (cut 15), dark trim,
       dark slits between, a line/bars chart in the dark selection ink -->
  <g>
    <!-- card 1: LINE -->
    <path d="M 250 337 h 150 v 438 l -15 15 h -135 Z" fill="#de2e2e"/>
    <path d="M 250 337 h 150 v 12 l -6 10 h -144 Z" fill="#350e10"/>
    <path d="M 250 772 h 150 v 3 l -15 15 h -135 Z" fill="#350e10"/>
    <rect x="400" y="337" width="50" height="453" fill="#1a0405"/>
    <polyline points="265,559 285,492 305,602 325,468 345,578 365,505 385,584"
              fill="none" stroke="#1a0405" stroke-width="2.5"/>
    <!-- card 2: BARS -->
    <path d="M 450 337 h 150 v 438 l -15 15 h -135 Z" fill="#de2e2e"/>
    <path d="M 450 337 h 150 v 12 l -6 10 h -144 Z" fill="#350e10"/>
    <path d="M 450 772 h 150 v 3 l -15 15 h -135 Z" fill="#350e10"/>
    <rect x="600" y="337" width="50" height="453" fill="#1a0405"/>
    <rect x="471" y="550" width="12" height="168" fill="#1a0405"/>
    <rect x="495" y="459" width="12" height="259" fill="#1a0405"/>
    <rect x="519" y="596" width="12" height="122" fill="#1a0405"/>
    <rect x="543" y="505" width="12" height="213" fill="#1a0405"/>
    <rect x="567" y="572" width="12" height="146" fill="#1a0405"/>
    <!-- card 3: LINE -->
    <path d="M 650 337 h 150 v 438 l -15 15 h -135 Z" fill="#de2e2e"/>
    <path d="M 650 337 h 150 v 12 l -6 10 h -144 Z" fill="#350e10"/>
    <path d="M 650 772 h 150 v 3 l -15 15 h -135 Z" fill="#350e10"/>
    <polyline points="665,559 685,492 705,602 725,468 745,578 765,505 785,584"
              fill="none" stroke="#1a0405" stroke-width="2.5"/>
  </g>

  <!-- vertical red rail on the right, with its dark cap -->
  <rect x="1150" y="396" width="260" height="441" fill="#5e1112"/>
  <rect x="1150" y="396" width="260" height="24" fill="#350e10"/>

  <!-- red corner block, bottom-right -->
  <rect x="1200" y="792" width="156" height="108" fill="#350e10"/>

  <!-- the three faint markers under the cards -->
  <rect x="250" y="837" width="30" height="18" fill="#1a0405"/>
  <rect x="450" y="837" width="30" height="18" fill="#1a0405"/>
  <rect x="650" y="837" width="30" height="18" fill="#1a0405"/>
</svg>