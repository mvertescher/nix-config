<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Rajdhani">
  <!-- KITSCH acceptance-test screen: the 4ST STORE, tracking the Behance
       reference (Part 1, the store screen in the kitsch run) closely
       enough that fidelity can be judged by eye against it: logotype and
       customer pill top-left, ticket-pill nav flowing into the solid
       page-curl, product cards with yellow shelf bands, the selected
       card gone solid yellow and grown its detail block, tiny captions
       and boxed footnote markers, rose bloom out of the top-right.

       When this screen can be built from library widgets, kitsch is
       feature-complete. Palette is the sampled one from
       target-components.svg. -->
  <defs>
    <radialGradient id="bloom" cx="82%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#a63355" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#6c1c3d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6c1c3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="selYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcc428"/>
      <stop offset="100%" stop-color="#f0a80a"/>
    </linearGradient>
    <pattern id="dotmat" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#7ddec8"/>
    </pattern>
    <pattern id="dotmatY" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#37220f"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#0b0b07"/>
  <rect width="1920" height="1080" fill="url(#bloom)"/>

