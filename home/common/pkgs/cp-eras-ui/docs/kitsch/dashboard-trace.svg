    <!-- warning tape -->
    <rect x="1172" y="306" width="180" height="24" fill="none" stroke="#f5cb23" stroke-width="1"/>
    <g fill="#d9b41f" font-family="Rajdhani" font-size="7">
      <text x="1178" y="316">ONLY CC35 CERTIFIED AND DHSF 5TH CLASS OFFICERS ARE</text>
      <text x="1178" y="325">ALLOWED TO MANIPULATE, ACCESS OR DISABLE THIS DEVICE.</text>
    </g>
    <!-- body -->
    <rect x="1207" y="299" width="225" height="367" fill="none" stroke="#f5cb23" stroke-width="1.5"/>
    <g fill="#e3bd20">
      <rect x="1224" y="345" width="196" height="11"/>
      <rect x="1224" y="365" width="188" height="11"/>
      <rect x="1224" y="385" width="192" height="11"/>
      <rect x="1224" y="405" width="176" height="11"/>
      <rect x="1224" y="425" width="120" height="11"/>
      <rect x="1224" y="448" width="194" height="11"/>
      <rect x="1224" y="468" width="184" height="11"/>
      <rect x="1224" y="488" width="188" height="11"/>
      <rect x="1224" y="508" width="98"  height="11"/>
    </g>
  </g>

  <!-- ==== B DEVICE SOFTWARE mark ==== -->
  <g font-family="Rajdhani" fill="#7fd4cc">
    <g font-size="8" letter-spacing="0.5" fill="#4f9a92">
      <text x="612" y="752">MAPS ARE PROVIDED BY SEOCHO.</text>
      <text x="612" y="762">SATELITE SERVICES SINCE 2006.</text>
