<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- KITSCH dashboard-trace: schematic of images/kitsch-dashboard.png
       (Behance e6ea35118663901.60e5fa669c12d, screen #49 of the kitsch run
       — the module hub. docs/sources.md used to claim the run holds no
       dashboard; it does, and this is it. #46 227dc1 is the same screen
       with presentation annotations in the right margin.)

       Every coordinate below is measured, not eyeballed:
         scripts/extract_spec.py images/kitsch-dashboard.png
       plus PCA on the per-colour ink masks for the rotated geometry, and
       the trace is held to the source by
         scripts/fidelity_check.sh -\-inventory kitsch dashboard

       What the source shows:
         - a rose bloom over the top of a near-black ground
         - header: boxed letters with in-fiction annotation text beside
           them — A USER (box x 169..197) over a notched GUES 7702 box at
           x 155..331, y 195..241; C SECURITY LEVEL (x 672..699) over four
           badges at x 664/725/785/844, y 189..241, the second filled
           amber; D DESCRIPTION (x 1215..1242) over the BRAINDANCE panel
         - THE MENU IS TWO THREE-BLADE FANS of rounded cards (190x60,
           r14), each solid card trailing a stack of translated ghost
           copies:
             left hub ~(455,470): VEHICLES rot 30 c(364,413); WEAPONS
             rot -30 c(549,413); PRODUCTS rot 90 c(458,575)
             right hub ~(825,535): PRODUCTS rot 90 c(824,427); EVENTS
             rot -30 c(731,586) — SOLID YELLOW, the selection;
             LOCATIONS rot 30 c(919,586). ALL SIX trails recede up-right
             at ~-50 deg in screen space (see the fan block below)
         - BRAINDANCE detail panel: yellow header tab at [1200,261,232,38]
           (chamfered tl/tr/bl), a small warning tape at ~[1172,306,180,24],
           an outlined body to y 666 holding two yellow paragraphs
         - B DEVICE SOFTWARE mark at x 575..602, y 742..769
         - a single line of yellow micro-text centred at the foot

       Palette sampled by k-means (extract_spec.py):
         ink   #2c9798 (3.8%)  #195147 (4.1%)  #f5cb23 (1.5%)
         ground #0d0d0c (46%) #9e4458 (15%) #211f1c (13%) #7a3346 (10%)
                #4f2630 (7%) -->
  <defs>
    <radialGradient id="bloom" cx="0.52" cy="-0.05" r="0.85">
      <stop offset="0"    stop-color="#a84a5e"/>
      <stop offset="0.45" stop-color="#7a3346"/>
      <stop offset="0.75" stop-color="#3a1c24"/>
      <stop offset="1"    stop-color="#0d0d0c"/>
    </radialGradient>
    <!-- one fan card, centred on its own origin -->
    <rect id="card"  x="-95" y="-30" width="190" height="60" rx="14"/>
    <rect id="badge" width="57" height="52"/>
  </defs>

  <rect width="1600" height="900" fill="#0d0d0c"/>
  <rect width="1600" height="620" fill="url(#bloom)"/>

  <!-- ==== header: boxed letters, annotations, labels ==== -->
  <g font-family="Rajdhani" fill="#7fd4cc">
    <g font-size="8" letter-spacing="0.5" fill="#4f9a92">
      <text x="205" y="112">SPARE TIME MANAGER WAS DEVELO-</text>
      <text x="205" y="122">PED BY SEOCHO. SERVING CUSTO-</text>
      <text x="205" y="132">MERS SINCE 2006.</text>
      <text x="707" y="112">SPARE TIME MANAGER WAS DEVELO-</text>
      <text x="707" y="122">PED BY SEOCHO. SERVING CUSTO-</text>
      <text x="707" y="132">MERS SINCE 2006.</text>
      <text x="1250" y="112">MAPS ARE PROVIDED BY SEOCHO.</text>
      <text x="1250" y="122">SATELITE SERVICES SINCE 2006.</text>
    </g>
    <rect x="169" y="109" width="28" height="27" fill="none" stroke="#7fd4cc" stroke-width="1.5"/>
    <text x="177" y="129" font-size="16">A</text>
    <text x="169" y="162" font-size="15" letter-spacing="2">USER</text>
    <rect x="672" y="109" width="27" height="27" fill="none" stroke="#7fd4cc" stroke-width="1.5"/>
    <text x="680" y="129" font-size="16">C</text>
    <text x="672" y="162" font-size="15" letter-spacing="2">SECURITY LEVEL</text>
    <rect x="1215" y="109" width="27" height="27" fill="none" stroke="#7fd4cc" stroke-width="1.5"/>
    <text x="1223" y="129" font-size="16">D</text>
    <text x="1215" y="162" font-size="15" letter-spacing="2">DESCRIPTION</text>
  </g>

  <!-- USER box with its bottom-left tab, x 155..331, y 195..241 -->
  <path d="M 155,195 H 331 V 241 H 205 L 185,258 H 165 L 155,248 Z"
        fill="none" stroke="#7fd4cc" stroke-width="2"/>
  <text x="170" y="225" font-family="Rajdhani" font-size="19" letter-spacing="1"
        fill="#a9e6df">GUES 7702</text>

  <!-- security badges, y 189..241, 02 filled amber -->
  <g font-family="Rajdhani" font-size="19" text-anchor="middle">
    <use href="#badge" x="664" y="189" fill="none" stroke="#7fd4cc" stroke-width="2"/>
    <text x="692" y="222" fill="#7fd4cc">01</text>
    <use href="#badge" x="725" y="189" fill="#f5cb23"/>
    <text x="753" y="222" fill="#6b4d08">02</text>
    <use href="#badge" x="785" y="189" fill="none" stroke="#7fd4cc" stroke-width="2"/>
    <text x="813" y="222" fill="#7fd4cc">03</text>
    <use href="#badge" x="844" y="189" fill="none" stroke="#7fd4cc" stroke-width="2"/>
    <text x="872" y="222" fill="#7fd4cc">04</text>
  </g>

  <!-- ==== the two fans ==== -->
  <!-- ghosts: translated copies trailing each solid card, dimming with
       depth. Every trail steps in the SAME SCREEN DIRECTION, up-right at
       about -50 deg — a shared depth extrusion, not an offset along each
       card's own normal. (An earlier version of this file offset each
       trail perpendicular to its card, which sent WEAPONS and EVENTS
       up-left and the right PRODUCTS down-right; the ink gate at 80x45
       passed it at 0.47 all the same.) Per-blade vectors were measured
       on a 50px grid over the source at 2x: VEHICLES (+15,-18) x8,
       WEAPONS (+13,-15) x9, left PRODUCTS (+13,-15) x8, right PRODUCTS
       (+21,-16) x7, EVENTS (+15,-15) x6, LOCATIONS (+16,-19) x9, then
       checked by overlaying the render on the photo. -->
  <g fill="#195147" stroke="#6cc4bd" stroke-width="1.2">
    <!-- VEHICLES: c(364,413) rot 30, trail (+15,-18) x8 -->
    <use href="#card" transform="translate(484 269) rotate(30)" fill-opacity="0.18" stroke-opacity="0.30"/>
    <use href="#card" transform="translate(469 287) rotate(30)" fill-opacity="0.26" stroke-opacity="0.39"/>
    <use href="#card" transform="translate(454 305) rotate(30)" fill-opacity="0.34" stroke-opacity="0.47"/>
    <use href="#card" transform="translate(439 323) rotate(30)" fill-opacity="0.42" stroke-opacity="0.56"/>
    <use href="#card" transform="translate(424 341) rotate(30)" fill-opacity="0.49" stroke-opacity="0.64"/>
    <use href="#card" transform="translate(409 359) rotate(30)" fill-opacity="0.57" stroke-opacity="0.73"/>
    <use href="#card" transform="translate(394 377) rotate(30)" fill-opacity="0.65" stroke-opacity="0.81"/>
    <use href="#card" transform="translate(379 395) rotate(30)" fill-opacity="0.73" stroke-opacity="0.90"/>
    <!-- WEAPONS: c(549,413) rot -30, trail (+13,-15) x9 -->
    <use href="#card" transform="translate(666 278) rotate(-30)" fill-opacity="0.18" stroke-opacity="0.30"/>
    <use href="#card" transform="translate(653 293) rotate(-30)" fill-opacity="0.25" stroke-opacity="0.38"/>
    <use href="#card" transform="translate(640 308) rotate(-30)" fill-opacity="0.32" stroke-opacity="0.45"/>
    <use href="#card" transform="translate(627 323) rotate(-30)" fill-opacity="0.39" stroke-opacity="0.52"/>
    <use href="#card" transform="translate(614 338) rotate(-30)" fill-opacity="0.46" stroke-opacity="0.60"/>
    <use href="#card" transform="translate(601 353) rotate(-30)" fill-opacity="0.52" stroke-opacity="0.68"/>
    <use href="#card" transform="translate(588 368) rotate(-30)" fill-opacity="0.59" stroke-opacity="0.75"/>
    <use href="#card" transform="translate(575 383) rotate(-30)" fill-opacity="0.66" stroke-opacity="0.82"/>
    <use href="#card" transform="translate(562 398) rotate(-30)" fill-opacity="0.73" stroke-opacity="0.90"/>
    <!-- left PRODUCTS: c(458,575) rot 90, trail (+13,-15) x8 -->
    <use href="#card" transform="translate(562 455) rotate(90)" fill-opacity="0.18" stroke-opacity="0.30"/>
    <use href="#card" transform="translate(549 470) rotate(90)" fill-opacity="0.26" stroke-opacity="0.39"/>
    <use href="#card" transform="translate(536 485) rotate(90)" fill-opacity="0.34" stroke-opacity="0.47"/>
    <use href="#card" transform="translate(523 500) rotate(90)" fill-opacity="0.42" stroke-opacity="0.56"/>
    <use href="#card" transform="translate(510 515) rotate(90)" fill-opacity="0.49" stroke-opacity="0.64"/>
    <use href="#card" transform="translate(497 530) rotate(90)" fill-opacity="0.57" stroke-opacity="0.73"/>
    <use href="#card" transform="translate(484 545) rotate(90)" fill-opacity="0.65" stroke-opacity="0.81"/>
    <use href="#card" transform="translate(471 560) rotate(90)" fill-opacity="0.73" stroke-opacity="0.90"/>
    <!-- right PRODUCTS: c(824,427) rot 90, trail (+21,-16) x7 -->
    <use href="#card" transform="translate(971 315) rotate(90)" fill-opacity="0.18" stroke-opacity="0.30"/>
    <use href="#card" transform="translate(950 331) rotate(90)" fill-opacity="0.27" stroke-opacity="0.40"/>
    <use href="#card" transform="translate(929 347) rotate(90)" fill-opacity="0.36" stroke-opacity="0.50"/>
    <use href="#card" transform="translate(908 363) rotate(90)" fill-opacity="0.46" stroke-opacity="0.60"/>
    <use href="#card" transform="translate(887 379) rotate(90)" fill-opacity="0.55" stroke-opacity="0.70"/>
    <use href="#card" transform="translate(866 395) rotate(90)" fill-opacity="0.64" stroke-opacity="0.80"/>
    <use href="#card" transform="translate(845 411) rotate(90)" fill-opacity="0.73" stroke-opacity="0.90"/>
    <!-- EVENTS (selection): c(731,586) rot -30, trail (+15,-15) x6 -->
    <use href="#card" transform="translate(821 496) rotate(-30)" fill-opacity="0.18" stroke-opacity="0.30"/>
    <use href="#card" transform="translate(806 511) rotate(-30)" fill-opacity="0.29" stroke-opacity="0.42"/>
    <use href="#card" transform="translate(791 526) rotate(-30)" fill-opacity="0.40" stroke-opacity="0.54"/>
    <use href="#card" transform="translate(776 541) rotate(-30)" fill-opacity="0.51" stroke-opacity="0.66"/>
    <use href="#card" transform="translate(761 556) rotate(-30)" fill-opacity="0.62" stroke-opacity="0.78"/>
    <use href="#card" transform="translate(746 571) rotate(-30)" fill-opacity="0.73" stroke-opacity="0.90"/>
    <!-- LOCATIONS: c(919,586) rot 30, trail (+16,-19) x9 -->
    <use href="#card" transform="translate(1063 415) rotate(30)" fill-opacity="0.18" stroke-opacity="0.30"/>
    <use href="#card" transform="translate(1047 434) rotate(30)" fill-opacity="0.25" stroke-opacity="0.38"/>
    <use href="#card" transform="translate(1031 453) rotate(30)" fill-opacity="0.32" stroke-opacity="0.45"/>
    <use href="#card" transform="translate(1015 472) rotate(30)" fill-opacity="0.39" stroke-opacity="0.52"/>
    <use href="#card" transform="translate(999 491) rotate(30)" fill-opacity="0.46" stroke-opacity="0.60"/>
    <use href="#card" transform="translate(983 510) rotate(30)" fill-opacity="0.52" stroke-opacity="0.68"/>
    <use href="#card" transform="translate(967 529) rotate(30)" fill-opacity="0.59" stroke-opacity="0.75"/>
    <use href="#card" transform="translate(951 548) rotate(30)" fill-opacity="0.66" stroke-opacity="0.82"/>
    <use href="#card" transform="translate(935 567) rotate(30)" fill-opacity="0.73" stroke-opacity="0.90"/>
  </g>

  <!-- solid cards + labels -->
  <g font-family="Rajdhani" font-size="21" letter-spacing="2.5" text-anchor="middle">
