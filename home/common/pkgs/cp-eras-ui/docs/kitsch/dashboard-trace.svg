<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- KITSCH dashboard-trace: schematic of images/kitsch-dashboard.png
       (Behance e6ea35118663901.60e5fa669c12d, screen #49 of the kitsch run
       — the module hub. docs/sources.md used to claim the run holds no
       dashboard; it does, and this is it. #46 227dc1 is the same screen
       with presentation annotations in the right margin.)

       Every coordinate below is measured, not eyeballed:
         scripts/extract_spec.py images/kitsch-dashboard.png
       plus PCA on the per-colour ink masks for the rotated geometry, and
       the trace is held to the source by
         scripts/fidelity_check.sh -\-inventory kitsch dashboard

       What the source shows:
         - a rose bloom over the top of a near-black ground
         - header: boxed letters with in-fiction annotation text beside
           them — A USER (box x 169..197) over a notched GUES 7702 box at
           x 155..331, y 195..241; C SECURITY LEVEL (x 672..699) over four
           badges at x 664/725/785/844, y 189..241, the second filled
           amber; D DESCRIPTION (x 1215..1242) over the BRAINDANCE panel
         - THE MENU IS TWO THREE-BLADE FANS of rounded cards (162x50,
           r8 — measured in each card's own frame by rotating the photo
           by -rot about the card centre and profiling the outline: every
           solid card spans x -81..81, y -25..25), each solid card
           trailing a stack of translated ghost copies:
             left hub ~(455,470): VEHICLES rot 30 c(364,413); WEAPONS
             rot -30 c(551,414); PRODUCTS rot 90 c(458,575)
             right hub ~(825,535): PRODUCTS rot 90 c(825,424); EVENTS
             rot -30 c(731,586) — SOLID YELLOW, the selection;
             LOCATIONS rot 30 c(919,586). ALL SIX trails recede up-right
             at -45 deg in screen space (see the fan block below)
         - BRAINDANCE detail panel: yellow header tab at [1200,261,232,38]
           (chamfered tl/tr/bl), a small warning tape at ~[1172,306,180,24],
           an outlined body to y 666 holding two yellow paragraphs
         - B DEVICE SOFTWARE mark at x 575..602, y 742..769
         - a single line of bright MINT micro-text centred at the foot, y 864..869 (measured; not yellow)

       Palette sampled by k-means (extract_spec.py):
         ink   #2c9798 (3.8%)  #195147 (4.1%)  #f5cb23 (1.5%)
         ground #0d0d0c (46%) #9e4458 (15%) #211f1c (13%) #7a3346 (10%)
                #4f2630 (7%) -->
  <defs>
    <radialGradient id="bloom" cx="0.52" cy="-0.05" r="0.85">
      <stop offset="0"    stop-color="#a84a5e"/>
      <stop offset="0.45" stop-color="#7a3346"/>
      <stop offset="0.75" stop-color="#3a1c24"/>
      <stop offset="1"    stop-color="#0d0d0c"/>
    </radialGradient>
    <!-- one fan card, centred on its own origin -->
    <rect id="card"  x="-81" y="-25" width="162" height="50" rx="8"/>
    <rect id="badge" width="57" height="52"/>
  </defs>

  <rect width="1600" height="900" fill="#0d0d0c"/>
  <rect width="1600" height="620" fill="url(#bloom)"/>

  <!-- ==== header: boxed letters, annotations, labels ==== -->
  <g font-family="Rajdhani" fill="#7fd4cc">
    <g font-size="8" letter-spacing="0.5" fill="#4f9a92">
      <text x="205" y="112">SPARE TIME MANAGER WAS DEVELO-</text>
      <text x="205" y="122">PED BY SEOCHO. SERVING CUSTO-</text>
      <text x="205" y="132">MERS SINCE 2006.</text>
      <text x="707" y="112">SPARE TIME MANAGER WAS DEVELO-</text>
      <text x="707" y="122">PED BY SEOCHO. SERVING CUSTO-</text>
      <text x="707" y="132">MERS SINCE 2006.</text>
      <text x="1250" y="112">MAPS ARE PROVIDED BY SEOCHO.</text>
      <text x="1250" y="122">SATELITE SERVICES SINCE 2006.</text>
    </g>
    <rect x="169" y="109" width="28" height="27" fill="none" stroke="#7fd4cc" stroke-width="1.5"/>
    <text x="177" y="129" font-size="16">A</text>
    <text x="169" y="162" font-size="15" letter-spacing="2">USER</text>
    <rect x="672" y="109" width="27" height="27" fill="none" stroke="#7fd4cc" stroke-width="1.5"/>
    <text x="680" y="129" font-size="16">C</text>
    <text x="672" y="162" font-size="15" letter-spacing="2">SECURITY LEVEL</text>
    <rect x="1215" y="109" width="27" height="27" fill="none" stroke="#7fd4cc" stroke-width="1.5"/>
    <text x="1223" y="129" font-size="16">D</text>
    <text x="1215" y="162" font-size="15" letter-spacing="2">DESCRIPTION</text>
  </g>

  <!-- USER box with its bottom-left tab, x 155..331, y 195..241 -->
  <path d="M 155,195 H 331 V 241 H 205 L 185,258 H 165 L 155,248 Z"
        fill="none" stroke="#7fd4cc" stroke-width="2"/>
  <text x="170" y="225" font-family="Rajdhani" font-size="19" letter-spacing="1"
        fill="#a9e6df">GUES 7702</text>

  <!-- security badges, y 189..241, 02 filled amber -->
  <g font-family="Rajdhani" font-size="19" text-anchor="middle">
    <use href="#badge" x="664" y="189" fill="none" stroke="#7fd4cc" stroke-width="2"/>
    <text x="692" y="222" fill="#7fd4cc">01</text>
    <use href="#badge" x="725" y="189" fill="#f5cb23"/>
    <text x="753" y="222" fill="#6b4d08">02</text>
    <use href="#badge" x="785" y="189" fill="none" stroke="#7fd4cc" stroke-width="2"/>
    <text x="813" y="222" fill="#7fd4cc">03</text>
    <use href="#badge" x="844" y="189" fill="none" stroke="#7fd4cc" stroke-width="2"/>
    <text x="872" y="222" fill="#7fd4cc">04</text>
  </g>

  <!-- ==== the two fans ==== -->
  <!-- ghosts: translated copies trailing each solid card, dimming with
       depth. Every trail steps in the SAME SCREEN DIRECTION, up-right —
       a shared depth extrusion, not an offset along each card's own
       normal. Measured 2026-09-02 by rotating the photo into each card's
       frame (see header) and reading the ghost outlines off row/column
       profiles of the bright-stroke mask:
         - the ghosts DO NOT SHRINK: every visible ghost strip spans the
           same 162 along the long axis as its solid card (LOCATIONS
           ghosts 1..4: widths 162.5 / 162 / 162 / 162; VEHICLES 162 /
           162 / 162), so no per-layer scale is applied
         - per-ghost step, in the card frame -> screen:
             VEHICLES  (+7.5,-27)  -> (+20.0,-19.6)
             WEAPONS   (+27.4,-7)  -> (+20.2,-19.8)
             L PRODUCTS (-20,-20)  -> (+20.0,-20.0)
             R PRODUCTS (-19.5,-19.6) -> (+19.6,-19.5)
             LOCATIONS (+7,-26)    -> (+20.0,-19.5)
             EVENTS: same (+27,-7) frame step as WEAPONS by eye
           so a single (+20,-20) is used for all six
         - ghost counts, where the fill drops into the ground/bloom:
           VEHICLES 6, WEAPONS 7 (fades into the rose bloom), left
           PRODUCTS 6 (+1 barely there), right PRODUCTS 6, EVENTS 5 (the
           rest run under the right PRODUCTS card), LOCATIONS 6
         - ghost fill sampled mid-strip over the black ground, G channel
           92 / 77 / 64 / 47 / 33 / 20 for ghosts 1..6 (LOCATIONS; VEHICLES
           93 / 78 / 67 / 59 / 47 / 39 on the bloom) with R~12, B~0.85 G —
           i.e. a greener teal than the solid #3cbbb4, hence #0f9f80 at
           opacity 0.58 / 0.48 / 0.40 / 0.30 / 0.21 / 0.12
       (An earlier version drew 190x60 r14 cards with 6-9 ghosts on
       13-21px steps; the ink gate at 80x45 passed both at ~0.54.) -->
  <g fill="#0f9f80" stroke="#6cc4bd" stroke-width="1.2">
    <!-- VEHICLES: c(364,413) rot 30, 6 ghosts -->
    <use href="#card" transform="translate(484 293) rotate(30)" fill-opacity="0.12" stroke-opacity="0.24"/>
    <use href="#card" transform="translate(464 313) rotate(30)" fill-opacity="0.21" stroke-opacity="0.34"/>
    <use href="#card" transform="translate(444 333) rotate(30)" fill-opacity="0.30" stroke-opacity="0.45"/>
    <use href="#card" transform="translate(424 353) rotate(30)" fill-opacity="0.40" stroke-opacity="0.56"/>
    <use href="#card" transform="translate(404 373) rotate(30)" fill-opacity="0.48" stroke-opacity="0.68"/>
    <use href="#card" transform="translate(384 393) rotate(30)" fill-opacity="0.58" stroke-opacity="0.80"/>
    <!-- WEAPONS: c(551,414) rot -30, 7 ghosts -->
    <use href="#card" transform="translate(691 274) rotate(-30)" fill-opacity="0.07" stroke-opacity="0.16"/>
    <use href="#card" transform="translate(671 294) rotate(-30)" fill-opacity="0.12" stroke-opacity="0.24"/>
    <use href="#card" transform="translate(651 314) rotate(-30)" fill-opacity="0.21" stroke-opacity="0.34"/>
    <use href="#card" transform="translate(631 334) rotate(-30)" fill-opacity="0.30" stroke-opacity="0.45"/>
    <use href="#card" transform="translate(611 354) rotate(-30)" fill-opacity="0.40" stroke-opacity="0.56"/>
    <use href="#card" transform="translate(591 374) rotate(-30)" fill-opacity="0.48" stroke-opacity="0.68"/>
    <use href="#card" transform="translate(571 394) rotate(-30)" fill-opacity="0.58" stroke-opacity="0.80"/>
    <!-- left PRODUCTS: c(458,575) rot 90, 6 ghosts -->
    <use href="#card" transform="translate(578 455) rotate(90)" fill-opacity="0.12" stroke-opacity="0.24"/>
    <use href="#card" transform="translate(558 475) rotate(90)" fill-opacity="0.21" stroke-opacity="0.34"/>
    <use href="#card" transform="translate(538 495) rotate(90)" fill-opacity="0.30" stroke-opacity="0.45"/>
    <use href="#card" transform="translate(518 515) rotate(90)" fill-opacity="0.40" stroke-opacity="0.56"/>
    <use href="#card" transform="translate(498 535) rotate(90)" fill-opacity="0.48" stroke-opacity="0.68"/>
    <use href="#card" transform="translate(478 555) rotate(90)" fill-opacity="0.58" stroke-opacity="0.80"/>
    <!-- right PRODUCTS: c(825,424) rot 90, 6 ghosts -->
    <use href="#card" transform="translate(945 304) rotate(90)" fill-opacity="0.12" stroke-opacity="0.24"/>
    <use href="#card" transform="translate(925 324) rotate(90)" fill-opacity="0.21" stroke-opacity="0.34"/>
    <use href="#card" transform="translate(905 344) rotate(90)" fill-opacity="0.30" stroke-opacity="0.45"/>
    <use href="#card" transform="translate(885 364) rotate(90)" fill-opacity="0.40" stroke-opacity="0.56"/>
    <use href="#card" transform="translate(865 384) rotate(90)" fill-opacity="0.48" stroke-opacity="0.68"/>
    <use href="#card" transform="translate(845 404) rotate(90)" fill-opacity="0.58" stroke-opacity="0.80"/>
    <!-- EVENTS (selection): c(731,586) rot -30, 5 ghosts -->
    <use href="#card" transform="translate(831 486) rotate(-30)" fill-opacity="0.21" stroke-opacity="0.34"/>
    <use href="#card" transform="translate(811 506) rotate(-30)" fill-opacity="0.30" stroke-opacity="0.45"/>
    <use href="#card" transform="translate(791 526) rotate(-30)" fill-opacity="0.40" stroke-opacity="0.56"/>
    <use href="#card" transform="translate(771 546) rotate(-30)" fill-opacity="0.48" stroke-opacity="0.68"/>
    <use href="#card" transform="translate(751 566) rotate(-30)" fill-opacity="0.58" stroke-opacity="0.80"/>
    <!-- LOCATIONS: c(919,586) rot 30, 6 ghosts -->
    <use href="#card" transform="translate(1039 466) rotate(30)" fill-opacity="0.12" stroke-opacity="0.24"/>
    <use href="#card" transform="translate(1019 486) rotate(30)" fill-opacity="0.21" stroke-opacity="0.34"/>
    <use href="#card" transform="translate(999 506) rotate(30)" fill-opacity="0.30" stroke-opacity="0.45"/>
    <use href="#card" transform="translate(979 526) rotate(30)" fill-opacity="0.40" stroke-opacity="0.56"/>
    <use href="#card" transform="translate(959 546) rotate(30)" fill-opacity="0.48" stroke-opacity="0.68"/>
    <use href="#card" transform="translate(939 566) rotate(30)" fill-opacity="0.58" stroke-opacity="0.80"/>
  </g>

  <!-- solid cards + labels -->
  <g font-family="Rajdhani" font-size="19" letter-spacing="2" text-anchor="middle">
    <g transform="translate(364 413) rotate(30)">
      <use href="#card" fill="#2c9798" stroke="#a9e6df" stroke-width="1.8"/>
      <text y="6.5" fill="#123c38">VEHICLES</text>
    </g>
    <g transform="translate(551 414) rotate(-30)">
      <use href="#card" fill="#2c9798" stroke="#a9e6df" stroke-width="1.8"/>
      <text y="6.5" fill="#123c38">WEAPONS</text>
    </g>
    <g transform="translate(458 575) rotate(90)">
      <use href="#card" fill="#2c9798" stroke="#a9e6df" stroke-width="1.8"/>
      <text y="6.5" fill="#123c38">PRODUCTS</text>
    </g>
    <g transform="translate(825 424) rotate(90)">
      <use href="#card" fill="#2c9798" stroke="#a9e6df" stroke-width="1.8"/>
      <text y="6.5" fill="#123c38">PRODUCTS</text>
    </g>
    <!-- the selection -->
    <g transform="translate(731 586) rotate(-30)">
      <use href="#card" fill="#f5cb23" stroke="#fce89a" stroke-width="1.8"/>
      <text y="6.5" fill="#4a3a05">EVENTS</text>
    </g>
    <g transform="translate(919 586) rotate(30)">
      <use href="#card" fill="#2c9798" stroke="#a9e6df" stroke-width="1.8"/>
      <text y="6.5" fill="#123c38">LOCATIONS</text>
    </g>
  </g>

  <!-- ==== BRAINDANCE panel ==== -->
  <g>
    <!-- header tab, chamfered tl/tr/bl -->
    <path d="M 1213,261 H 1419 L 1432,274 V 299 H 1213 L 1200,286 V 274 Z"
          fill="#f5cb23"/>
    <text x="1222" y="288" font-family="Rajdhani" font-size="20" font-weight="600"
          letter-spacing="1" fill="#4a3a05">BRAINDANCE</text>
    <!-- warning tape -->
    <rect x="1172" y="306" width="180" height="24" fill="none" stroke="#f5cb23" stroke-width="1"/>
    <g fill="#d9b41f" font-family="Rajdhani" font-size="7">
      <text x="1178" y="316">ONLY CC35 CERTIFIED AND DHSF 5TH CLASS OFFICERS ARE</text>
      <text x="1178" y="325">ALLOWED TO MANIPULATE, ACCESS OR DISABLE THIS DEVICE.</text>
    </g>
    <!-- body -->
    <rect x="1207" y="299" width="225" height="367" fill="none" stroke="#f5cb23" stroke-width="1.5"/>
    <g fill="#e3bd20">
      <rect x="1224" y="345" width="196" height="11"/>
      <rect x="1224" y="365" width="188" height="11"/>
      <rect x="1224" y="385" width="192" height="11"/>
      <rect x="1224" y="405" width="176" height="11"/>
      <rect x="1224" y="425" width="120" height="11"/>
      <rect x="1224" y="448" width="194" height="11"/>
      <rect x="1224" y="468" width="184" height="11"/>
      <rect x="1224" y="488" width="188" height="11"/>
      <rect x="1224" y="508" width="98"  height="11"/>
    </g>
  </g>

  <!-- ==== B DEVICE SOFTWARE mark ==== -->
  <g font-family="Rajdhani" fill="#7fd4cc">
    <g font-size="8" letter-spacing="0.5" fill="#4f9a92">
      <text x="612" y="752">MAPS ARE PROVIDED BY SEOCHO.</text>
      <text x="612" y="762">SATELITE SERVICES SINCE 2006.</text>
    </g>
    <rect x="575" y="742" width="27" height="27" fill="none" stroke="#7fd4cc" stroke-width="1.5"/>
    <text x="583" y="762" font-size="16">B</text>
    <text x="575" y="795" font-size="15" letter-spacing="2">DEVICE SOFTWARE</text>
  </g>

  <!-- ==== footer micro-text, y 864..869, x 504..1095: BRIGHT MINT, the
       same line as on the other three screens (pixel mean (81,177,156),
       p90 (127,240,209) in the photo). An earlier version drew it yellow
       #d9b41f at size 10, which the photo does not support, and the two
       runs overlapped ==== -->
  <g font-family="Rajdhani" font-size="9" letter-spacing="0.2" fill="#82f0d3">
    <text x="504" y="870" font-weight="700">ARASAKA CONSUMER TECHNOLOGY</text>
    <text x="640" y="870">ONLY CC35 CERTIFIED AND DHSF 5TH CLASS OFFICERS ARE ALLOWED TO MANIPULATE, ACCESS OR DISABLE THIS DEVICE.</text>
  </g>
</svg>
