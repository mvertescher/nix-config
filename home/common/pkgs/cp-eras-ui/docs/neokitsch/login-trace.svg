  </g>

  </g><!-- lines -->

  <!-- every glyph, gathered here so the text halo can differ from the
       bars' -->
  <g id="text" font-family="Rajdhani">
  <!-- ==== header ==== -->
  <g fill="#f5bf75">
    <!-- logotype: a custom stencil face; drawn as bold text scaled
         horizontally onto the measured ink extent x 92.1..272.1 (2026-09-03:
         was textLength="185", which librsvg ignores, and rendered 156
         wide) -->
    <text transform="translate(91 87) scale(1.155 1)" font-size="36" font-weight="700" letter-spacing="3">ARASAKA</text>
    <text x="118" y="97" font-size="8" letter-spacing="0.8" fill="#d9a877">ARASAKA CONSUMER TECHNOLOGY</text>
    <g font-size="8" fill="#d9a877" letter-spacing="0.5">
      <text x="96" y="115" font-size="9">57ASD4AV15AA</text>
      <text x="200" y="110">COMBAT COLONIZATION</text>
      <text x="200" y="120">DEFENCE PROGRAM</text>
    </g>
    <text x="1293" y="87" font-size="28" font-weight="500" letter-spacing="1">10:10 PM</text>
    <text x="1295" y="110" font-size="13" font-weight="500" letter-spacing="0.5">NIGHT CITY</text>
    <text x="1295" y="129" font-size="13" font-weight="500" letter-spacing="0.5">AREA</text>
  </g>

  <!-- ==== the two entry groups' glyphs; the letters are A and B ==== -->
  <use href="#entrytext"/>
  <use href="#entrytext" x="420"/>
  <g font-size="15" fill="#d9a877" text-anchor="middle">
    <text x="429" y="483">A</text>
    <text x="849" y="483">B</text>
  </g>

  <!-- ==== footer ==== -->
  <!-- fitted by letter-spacing to the source's x 501..1097 (2026-09-03:
       was textLength="618", a no-op in librsvg) -->
  <text x="800" y="875" font-size="9.5" letter-spacing="0.06" fill="#c8914d" text-anchor="middle"><tspan font-weight="700">ARASAKA CONSUMER TECHNOLOGY</tspan>  ONLY CC35 CERTIFIED AND DHSF 5TH CLASS OFFICERS ARE ALLOWED TO MANIPULATE, ACCESS OR DISABLE THIS DEVICE.</text>
  </g>
  </g><!-- content -->
</svg>
