    <path d="M 35,812 V 735.1 Q 35,727.1 43,727.1 H 358.0 C 384.4,727.1 379.6,782.1 406.0,782.1 H 1210.0 C 1236.4,782.1 1231.6,727.1 1258.0,727.1 H 1556 Q 1564,727.1 1564,735.1 V 812" stroke-opacity="0.30"/>
