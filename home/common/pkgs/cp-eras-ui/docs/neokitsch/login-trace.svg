       both ends curl down into a vertical at x=35 / 1564 to y=812.
       Brightness steps from 0.30 (top, dimmest) to 1.0 (bottom). -->
  <path d="M 35,727.1 H 358.0 C 384.4,727.1 379.6,782.1 406.0,782.1 H 1210.0 C 1236.4,782.1 1231.6,727.1 1258.0,727.1 H 1564 V 809.0 H 1218.1 C 1188.2,809.0 1193.7,845.7 1163.8,845.7 H 452.2 C 422.3,845.7 427.8,809.0 397.9,809.0 H 35 Z" fill="url(#bandglow)"/>
