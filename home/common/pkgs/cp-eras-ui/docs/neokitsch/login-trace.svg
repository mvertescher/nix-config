<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- NEOKITSCH login-trace: schematic of images/neokitsch-login.png
       (Behance a43e76118663901.60901b230a734, screen #70 of the neokitsch
       run — the ARASAKA login). Source is 3840x2160; every coordinate
       here is the source divided by 2.4, measured, not eyeballed:
         scripts/extract_spec.py images/neokitsch-login.png
       plus row/column scans of the red channel for the widget edges and
       the strand positions of the wire band, and held to the source by
         scripts/fidelity_check.sh -\-inventory neokitsch login
       (the inks gate).

       What the source shows, top to bottom:
         - the same violet-over-black haze every screen of this run
           wears (its blue-channel profile is pixel-identical to the
           dashboard's at every sampled column, so the lobe geometry and
           stops below are the dashboard-trace's, carried over)
         - top-left: the ARASAKA logotype, a heavy stencil face, spanning
           x 93..278, y 59..88; under it ARASAKA CONSUMER TECHNOLOGY
           (x 118..251, baseline ~97) and a two-cell outlined box at
           [90,100]..[275,125], divider at x~195, holding 57ASD4AV15AA
           and COMBAT COLONIZATION / DEFENCE PROGRAM
         - top-right: 10:10 PM large (x 1293..1404, y 67..87), then
           NIGHT CITY and AREA in small caps beneath
         - mid-height: TWO IDENTICAL ENTRY GROUPS, the right one exactly
           +420 in x. Each: a PRASE_6054012 label (x 415, cap top 335),
           a dark chocolate field [417,361]..[762,403] (#3c1c11, no
           outline), a solid gold bar [417,414]..[761,441] with a
           ~16x13 chamfer cut off its bottom-LEFT corner only, carrying
           ENTER / LOGIN in a wide light face in dark brown; a 26x26
           letter box A (416,465) / B (836,465) with the era's folded
           corner, and the SPARE TIME MANAGER micro-text beside it
         - across the foot: the stacked-hairline WIRE BAND as a wide
           trapezoid — 22 strands. On the outer plateaus (x 35..~350 and
           ~1265..1564) they run y 727..809, spaced 3.9; each strand
           drops through an S-bend (top strand leaves at x~358, lands at
           ~406; bottom strand 398 -> 452; mirrored about x=808 on the
           right) onto the low centre plateau y 782..846, where the
           spacing tightens to 3.0, so the bends fan slightly. Both ends curl DOWN into a vertical at x=35 /
           x=1564 that runs to y~812 (the verticals overlap into one
           bright edge). Brightness rises from top strand (~#502812)
           to bottom (~#eab15c), and the floor BETWEEN the strands
           glows the same way, black at the top strand to ~#371c11 at
           the bottom one, with no spill outside the band
         - footer line at y~875, centred: ARASAKA CONSUMER TECHNOLOGY
           (bold) ONLY CC35 CERTIFIED AND DHSF 5TH CLASS OFFICERS ARE
           ALLOWED TO MANIPULATE, ACCESS OR DISABLE THIS DEVICE.
         - every glyph and bar sits on a soft vertically-smeared glow
           (it is what fattens the #351b11 family to 5.5%); drawn once
           as a blurred copy of the content group under the crisp content
         - nothing else: no frame, no header rule, no cards. The screen
           is sparse by design.

       Palette sampled by k-means (extract_spec.py):
         ink   #fbc171 (1.5%, the two bars)  #aa7a44  #664121
               #351b11 (5.5%: the fields, the dim strands and the glow)
         ground #0e0a0d (65%) #383852 / #59456b (violet haze) #182535 -->
  <defs>
    <!-- haze: identical backdrop to dashboard-trace.svg (measured there;
         re-verified here by column profile) -->
    <radialGradient id="hazeblue" gradientUnits="userSpaceOnUse"
        cx="900" cy="-120" r="1030"
        gradientTransform="rotate(2 900 -120) translate(900 -120) scale(1 0.515) translate(-900 120)">
      <stop offset="0"    stop-color="#223350" stop-opacity="0"/>
      <stop offset="0.60" stop-color="#223350" stop-opacity="0"/>
      <stop offset="0.68" stop-color="#223350" stop-opacity="0.85"/>
      <stop offset="0.76" stop-color="#1a2c46" stop-opacity="0.80"/>
      <stop offset="0.84" stop-color="#101d30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hazebluefade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#000000"/>
      <stop offset="0.12" stop-color="#1a1a1a"/>
      <stop offset="0.22" stop-color="#7a7a7a"/>
      <stop offset="0.40" stop-color="#ffffff"/>
      <stop offset="1"    stop-color="#ffffff"/>
    </linearGradient>
    <mask id="bluemask">
      <rect width="1600" height="900" fill="url(#hazebluefade)"/>
    </mask>
    <radialGradient id="haze" gradientUnits="userSpaceOnUse"
        cx="825" cy="-120" r="1030"
        gradientTransform="rotate(1.3 825 -120) translate(825 -120) scale(1 0.515) translate(-825 120)">
      <stop offset="0"     stop-color="#574568"/>
      <stop offset="0.258" stop-color="#574568"/>
      <stop offset="0.572" stop-color="#3a3853"/>
      <stop offset="0.873" stop-color="#16121a"/>
      <stop offset="1"     stop-color="#0e0a0d"/>
    </radialGradient>
    <!-- boxed section letter: 26x26 rounded plate, folded bottom-right
         corner (the era's mini-SIM motif; same as dashboard-trace) -->
    <g id="letterbox" fill="none" stroke-width="1.4">
      <path d="M 3,0 H 23 Q 26,0 26,3 V 17 L 19,24 Q 17,26 14,26 H 3
               Q 0,26 0,23 V 3 Q 0,0 3,0 Z"/>
      <path d="M 26,17 H 21 Q 19,17 19,19 V 24" stroke-width="1"/>
    </g>
    <!-- one entry group at its measured origin (left group; the right
         group is the same at +420) -->
    <g id="entry" font-family="Rajdhani">
      <text x="415" y="351" font-size="21" font-weight="600" letter-spacing="1" fill="#f5bf75">PRASE_6054012</text>
      <rect x="417" y="361" width="345" height="42" fill="#3c1c11"/>
      <!-- gold bar, bottom-left chamfer 16x13 -->
      <path d="M 417,414 H 761 V 441 H 433 L 417,428 Z" fill="#fbc171"/>
      <text x="589" y="435" font-size="14" font-weight="300" letter-spacing="3"
            fill="#6b3f1e" text-anchor="middle">ENTER / LOGIN</text>
      <use href="#letterbox" x="416" y="465" stroke="#c8914d"/>
      <text x="429" y="483" font-size="15" fill="#d9a877" text-anchor="middle">A</text>
      <g font-size="7" fill="#a97c48" letter-spacing="0.4">
        <text x="454" y="471">SPARE TIME MANAGER WAS DEVELOPED BY SEOCHO.</text>
        <text x="454" y="479">SERVING CUSTOMERS SINCE 2006.</text>
      </g>
    </g>
    <!-- the band's interior glow: the floor between strands is black at
         the top strand and rises to ~#371c11 at the bottom one, with no
         spill below (measured at x=200: red 13 at y725, 56 at y805, 14
         at y820) -->
    <linearGradient id="bandglow" x1="0" y1="727" x2="0" y2="846" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#371c11" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#371c11" stop-opacity="0.55"/>
      <stop offset="1"    stop-color="#371c11" stop-opacity="1"/>
    </linearGradient>
    <!-- the halo: every glyph and bar in the source sits on a soft
         vertically-smeared glow (part of the #351b11 family). Drawn once
         as a blurred, darkened copy of the content group under the crisp
         content. -->
    <filter id="halo" x="-5%" y="-10%" width="110%" height="120%">
      <feGaussianBlur stdDeviation="1.5 4.5"/>
      <feColorMatrix type="matrix" values="0.43 0 0 0 0  0 0.32 0 0 0  0 0 0.21 0 0  0 0 0 1.45 0"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#0e0a0d"/>
  <rect width="1600" height="900" fill="url(#haze)"/>
  <rect width="1600" height="560" fill="url(#hazeblue)" mask="url(#bluemask)"/>

  <use href="#content" filter="url(#halo)"/>
  <g id="content">

  <!-- ==== header ==== -->
  <g font-family="Rajdhani" fill="#f5bf75">
    <!-- logotype: a custom stencil face; drawn as bold text forced to
         the measured 185px width -->
    <text x="93" y="87" font-size="36" font-weight="700" letter-spacing="3"
          textLength="185" lengthAdjust="spacingAndGlyphs">ARASAKA</text>
    <text x="118" y="97" font-size="8" letter-spacing="0.8" fill="#d9a877">ARASAKA CONSUMER TECHNOLOGY</text>
    <g fill="none" stroke="#c8914d" stroke-width="1">
      <rect x="90" y="100" width="185" height="25"/>
      <line x1="195" y1="100" x2="195" y2="125"/>
    </g>
    <g font-size="8" fill="#d9a877" letter-spacing="0.5">
      <text x="96" y="115" font-size="9">57ASD4AV15AA</text>
      <text x="200" y="110">COMBAT COLONIZATION</text>
      <text x="200" y="120">DEFENCE PROGRAM</text>
    </g>
    <text x="1293" y="87" font-size="28" font-weight="500" letter-spacing="1">10:10 PM</text>
    <text x="1295" y="110" font-size="13" font-weight="500" letter-spacing="0.5">NIGHT CITY</text>
    <text x="1295" y="129" font-size="13" font-weight="500" letter-spacing="0.5">AREA</text>
  </g>

  <!-- ==== the two entry groups ==== -->
  <use href="#entry"/>
  <g transform="translate(420 0)">
    <use href="#entry"/>
    <!-- the right group's letter is B, not A -->
    <rect x="419" y="468" width="20" height="20" fill="#0e0a0d"/>
    <text x="429" y="483" font-family="Rajdhani" font-size="15" fill="#d9a877" text-anchor="middle">B</text>
  </g>

  <!-- ==== the wire band ==== -->
  <!-- 22 strands: strand i runs the outer plateaus at y 727.1+3.9i,
       leaves them at x 358+1.9i, S-bends to the centre plateau at
       y 782.1+3.03i from x 406+2.2i, mirrored about x=808 on the right;
       both ends curl down into a vertical at x=35 / 1564 to y=812.
       Brightness steps from 0.30 (top, dimmest) to 1.0 (bottom). -->
  <path d="M 35,727.1 H 358.0 C 384.4,727.1 379.6,782.1 406.0,782.1 H 1210.0 C 1236.4,782.1 1231.6,727.1 1258.0,727.1 H 1564 V 809.0 H 1218.1 C 1188.2,809.0 1193.7,845.7 1163.8,845.7 H 452.2 C 422.3,845.7 427.8,809.0 397.9,809.0 H 35 Z" fill="url(#bandglow)"/>
  <g fill="none" stroke="#eab15c" stroke-width="1.2">
    <path d="M 35,812 V 735.1 Q 35,727.1 43,727.1 H 358.0 C 384.4,727.1 379.6,782.1 406.0,782.1 H 1210.0 C 1236.4,782.1 1231.6,727.1 1258.0,727.1 H 1556 Q 1564,727.1 1564,735.1 V 812" stroke-opacity="0.30"/>
    <path d="M 35,812 V 739.0 Q 35,731.0 43,731.0 H 359.9 C 386.5,731.0 381.6,785.1 408.2,785.1 H 1207.8 C 1234.4,785.1 1229.5,731.0 1256.1,731.0 H 1556 Q 1564,731.0 1564,739.0 V 812" stroke-opacity="0.33"/>
    <path d="M 35,812 V 742.9 Q 35,734.9 43,734.9 H 361.8 C 388.5,734.9 383.7,788.2 410.4,788.2 H 1205.6 C 1232.3,788.2 1227.5,734.9 1254.2,734.9 H 1556 Q 1564,734.9 1564,742.9 V 812" stroke-opacity="0.37"/>
    <path d="M 35,812 V 746.8 Q 35,738.8 43,738.8 H 363.7 C 390.6,738.8 385.7,791.2 412.6,791.2 H 1203.4 C 1230.3,791.2 1225.4,738.8 1252.3,738.8 H 1556 Q 1564,738.8 1564,746.8 V 812" stroke-opacity="0.40"/>
    <path d="M 35,812 V 750.7 Q 35,742.7 43,742.7 H 365.6 C 392.7,742.7 387.7,794.2 414.8,794.2 H 1201.2 C 1228.3,794.2 1223.3,742.7 1250.4,742.7 H 1556 Q 1564,742.7 1564,750.7 V 812" stroke-opacity="0.43"/>
    <path d="M 35,812 V 754.6 Q 35,746.6 43,746.6 H 367.5 C 394.7,746.6 389.8,797.2 417.0,797.2 H 1199.0 C 1226.2,797.2 1221.3,746.6 1248.5,746.6 H 1556 Q 1564,746.6 1564,754.6 V 812" stroke-opacity="0.47"/>
    <path d="M 35,812 V 758.5 Q 35,750.5 43,750.5 H 369.4 C 396.8,750.5 391.8,800.3 419.2,800.3 H 1196.8 C 1224.2,800.3 1219.2,750.5 1246.6,750.5 H 1556 Q 1564,750.5 1564,758.5 V 812" stroke-opacity="0.50"/>
    <path d="M 35,812 V 762.4 Q 35,754.4 43,754.4 H 371.3 C 398.9,754.4 393.8,803.3 421.4,803.3 H 1194.6 C 1222.2,803.3 1217.1,754.4 1244.7,754.4 H 1556 Q 1564,754.4 1564,762.4 V 812" stroke-opacity="0.53"/>
    <path d="M 35,812 V 766.3 Q 35,758.3 43,758.3 H 373.2 C 400.9,758.3 395.9,806.3 423.6,806.3 H 1192.4 C 1220.1,806.3 1215.1,758.3 1242.8,758.3 H 1556 Q 1564,758.3 1564,766.3 V 812" stroke-opacity="0.57"/>
    <path d="M 35,812 V 770.2 Q 35,762.2 43,762.2 H 375.1 C 403.0,762.2 397.9,809.4 425.8,809.4 H 1190.2 C 1218.1,809.4 1213.0,762.2 1240.9,762.2 H 1556 Q 1564,762.2 1564,770.2 V 812" stroke-opacity="0.60"/>
    <path d="M 35,812 V 774.1 Q 35,766.1 43,766.1 H 377.0 C 405.1,766.1 399.9,812.4 428.0,812.4 H 1188.0 C 1216.0,812.4 1211.0,766.1 1239.0,766.1 H 1556 Q 1564,766.1 1564,774.1 V 812" stroke-opacity="0.63"/>
    <path d="M 35,812 V 778.0 Q 35,770.0 43,770.0 H 378.9 C 407.1,770.0 402.0,815.4 430.2,815.4 H 1185.8 C 1214.0,815.4 1208.9,770.0 1237.1,770.0 H 1556 Q 1564,770.0 1564,778.0 V 812" stroke-opacity="0.67"/>
    <path d="M 35,812 V 781.9 Q 35,773.9 43,773.9 H 380.8 C 409.2,773.9 404.0,818.5 432.4,818.5 H 1183.6 C 1212.0,818.5 1206.8,773.9 1235.2,773.9 H 1556 Q 1564,773.9 1564,781.9 V 812" stroke-opacity="0.70"/>
    <path d="M 35,812 V 785.8 Q 35,777.8 43,777.8 H 382.7 C 411.2,777.8 406.1,821.5 434.6,821.5 H 1181.4 C 1209.9,821.5 1204.8,777.8 1233.3,777.8 H 1556 Q 1564,777.8 1564,785.8 V 812" stroke-opacity="0.73"/>
    <path d="M 35,812 V 789.7 Q 35,781.7 43,781.7 H 384.6 C 413.3,781.7 408.1,824.5 436.8,824.5 H 1179.2 C 1207.9,824.5 1202.7,781.7 1231.4,781.7 H 1556 Q 1564,781.7 1564,789.7 V 812" stroke-opacity="0.77"/>
    <path d="M 35,812 V 793.6 Q 35,785.6 43,785.6 H 386.5 C 415.4,785.6 410.1,827.6 439.0,827.6 H 1177.0 C 1205.9,827.6 1200.6,785.6 1229.5,785.6 H 1556 Q 1564,785.6 1564,793.6 V 812" stroke-opacity="0.80"/>
    <path d="M 35,812 V 797.5 Q 35,789.5 43,789.5 H 388.4 C 417.4,789.5 412.2,830.6 441.2,830.6 H 1174.8 C 1203.8,830.6 1198.6,789.5 1227.6,789.5 H 1556 Q 1564,789.5 1564,797.5 V 812" stroke-opacity="0.83"/>
    <path d="M 35,812 V 801.4 Q 35,793.4 43,793.4 H 390.3 C 419.5,793.4 414.2,833.6 443.4,833.6 H 1172.6 C 1201.8,833.6 1196.5,793.4 1225.7,793.4 H 1556 Q 1564,793.4 1564,801.4 V 812" stroke-opacity="0.87"/>
    <path d="M 35,812 V 805.3 Q 35,797.3 43,797.3 H 392.2 C 421.6,797.3 416.2,836.6 445.6,836.6 H 1170.4 C 1199.8,836.6 1194.4,797.3 1223.8,797.3 H 1556 Q 1564,797.3 1564,805.3 V 812" stroke-opacity="0.90"/>
    <path d="M 35,812 V 809.2 Q 35,801.2 43,801.2 H 394.1 C 423.6,801.2 418.3,839.7 447.8,839.7 H 1168.2 C 1197.7,839.7 1192.4,801.2 1221.9,801.2 H 1556 Q 1564,801.2 1564,809.2 V 812" stroke-opacity="0.93"/>
    <path d="M 35,812 V 813.1 Q 35,805.1 43,805.1 H 396.0 C 425.7,805.1 420.3,842.7 450.0,842.7 H 1166.0 C 1195.7,842.7 1190.3,805.1 1220.0,805.1 H 1556 Q 1564,805.1 1564,813.1 V 812" stroke-opacity="0.97"/>
    <path d="M 35,812 V 817.0 Q 35,809.0 43,809.0 H 397.9 C 427.8,809.0 422.3,845.7 452.2,845.7 H 1163.8 C 1193.7,845.7 1188.2,809.0 1218.1,809.0 H 1556 Q 1564,809.0 1564,817.0 V 812" stroke-opacity="1.00"/>
  </g>

  <!-- ==== footer ==== -->
  <text x="800" y="875" font-family="Rajdhani" font-size="9.5" letter-spacing="0.1" fill="#c8914d" text-anchor="middle" textLength="618" lengthAdjust="spacingAndGlyphs"><tspan font-weight="700">ARASAKA CONSUMER TECHNOLOGY</tspan>  ONLY CC35 CERTIFIED AND DHSF 5TH CLASS OFFICERS ARE ALLOWED TO MANIPULATE, ACCESS OR DISABLE THIS DEVICE.</text>
  </g>
</svg>
