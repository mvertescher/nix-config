    <path d="M 35,812 V 746.8 Q 35,738.8 43,738.8 H 363.7 C 390.6,738.8 385.7,791.2 412.6,791.2 H 1203.4 C 1230.3,791.2 1225.4,738.8 1252.3,738.8 H 1556 Q 1564,738.8 1564,746.8 V 812" stroke-opacity="0.40"/>
    <path d="M 35,812 V 750.7 Q 35,742.7 43,742.7 H 365.6 C 392.7,742.7 387.7,794.2 414.8,794.2 H 1201.2 C 1228.3,794.2 1223.3,742.7 1250.4,742.7 H 1556 Q 1564,742.7 1564,750.7 V 812" stroke-opacity="0.43"/>
