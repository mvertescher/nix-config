  <text x="960" y="916" font-size="11" letter-spacing="1" fill="#8a7048" text-anchor="middle">
    <tspan font-weight="700" fill="#d3b279">ARASAKA CONSUMER TECHNOLOGY</tspan>&#160;&#160;ONLY CC35 CERTIFIED AND DHSF 5TH CLASS OFFICERS ARE ALLOWED TO MANIPULATE, ACCESS OR DISABLE THIS DEVICE.
