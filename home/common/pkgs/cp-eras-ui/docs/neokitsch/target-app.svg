<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Rajdhani">
  <!-- NEOKITSCH acceptance-test screen: the 4ST STORE, tracking the
       right-hand screen of the Behance reference (p1-061 / p1-115)
       closely enough to judge fidelity by eye: gold device frame with
       stepped corners, logotype and footnote markers along the top
       strata, veneer BASKET panel top-right, customer meta, slim nav
       pills with the veneer selection, product cards with clipped
       top-right corners and footer name bands - the selected one
       veneer-filled and grown - and the caption strip at the frame's
       foot.

       When this can be built from library widgets, neokitsch is
       feature-complete. Palette is the sampled one from
       target-components.svg; the veneer is gradient+grain here but
       should be a texture asset in the implementation. -->
  <defs>
    <radialGradient id="bloomV" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#4a4468" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#34344c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#34344c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="veneer" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0%" stop-color="#f4c474"/>
      <stop offset="45%" stop-color="#e3af5f"/>
      <stop offset="70%" stop-color="#f0be6e"/>
      <stop offset="100%" stop-color="#d8a558"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcc474"/>
      <stop offset="100%" stop-color="#c78948"/>
    </linearGradient>
    <linearGradient id="frameG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c69a55"/>
      <stop offset="50%" stop-color="#916424"/>
      <stop offset="100%" stop-color="#7a5220"/>
    </linearGradient>
    <pattern id="grain" width="120" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 4 q30 -3 60 0 t60 0" fill="none" stroke="#b98a44" stroke-width="0.8" opacity="0.55"/>
      <path d="M0 10 q26 3 52 0 t68 1" fill="none" stroke="#a97c3a" stroke-width="0.6" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#0a0a0a"/>

  <!-- ===== device frame: double gold stroke, stepped corners ===== -->
  <path d="M150 120
           h300 l24 -20 h972 l24 20 h300
           q30 0 30 30 v760 q0 30 -30 30
           h-300 l-24 20 h-972 l-24 -20 h-300
           q-30 0 -30 -30 v-760 q0 -30 30 -30 Z"
        fill="#0d0b10" stroke="url(#frameG)" stroke-width="5"/>
  <path d="M150 128
           h298 l24 -20 h976 l24 20 h298
           q22 0 22 22 v752 q0 22 -22 22
           h-298 l-24 20 h-976 l-24 -20 h-298
           q-22 0 -22 -22 v-752 q0 -22 22 -22 Z"
        fill="none" stroke="#5e3414" stroke-width="1.5"/>

  <!-- violet haze inside the frame -->
  <path d="M150 120 h1620 v420 h-1620 Z" fill="url(#bloomV)"/>

  <!-- ===== logotype + top strata with footnotes ===== -->
  <text x="230" y="222" font-size="52" font-weight="700" letter-spacing="2" fill="#e7c686">4S<tspan font-weight="300" fill="#a98d5c">T</tspan></text>
  <text x="234" y="248" font-size="14" letter-spacing="12" fill="#d3b279">S T O R E</text>

  <g stroke="#634427" stroke-width="1" fill="none">
    <path d="M480 210 h900"/>
    <path d="M486 215 h888" opacity="0.8"/>
    <path d="M496 220 h868" opacity="0.6"/>
    <path d="M510 225 h840" opacity="0.45"/>
    <path d="M528 230 h804" opacity="0.3"/>
  </g>
  <rect x="560" y="196" width="24" height="24" fill="#0d0b10" stroke="#d3b279" stroke-width="1.5"/>
  <text x="572" y="213" font-size="14" font-weight="700" fill="#d3b279" text-anchor="middle">A</text>
  <text x="596" y="205" font-size="8" fill="#8a7048">SPARE TIME MANAGER WAS DEVELOPED BY SEOCHO.</text>
  <text x="596" y="215" font-size="8" fill="#8a7048">SERVING CUSTOMERS SINCE 2006.</text>
  <rect x="1160" y="196" width="24" height="24" fill="#0d0b10" stroke="#d3b279" stroke-width="1.5"/>
  <text x="1172" y="213" font-size="14" font-weight="700" fill="#d3b279" text-anchor="middle">C</text>
  <text x="1196" y="205" font-size="8" fill="#8a7048">MAPS ARE PROVIDED BY SEOCHO.</text>
  <text x="1196" y="215" font-size="8" fill="#8a7048">SATELLITE SERVICES SINCE 2006.</text>

  <!-- ===== basket panel, veneer, top-right ===== -->
  <g>
    <path d="M1480 170 h240 v56 h-240 Z" fill="url(#veneer)"/>
    <path d="M1480 170 h240 v56 h-240 Z" fill="url(#grain)"/>
    <text x="1496" y="192" font-size="14" font-weight="700" letter-spacing="1" fill="#3a2410">BASKET</text>
    <g fill="#3a2410">
      <rect x="1638" y="178" width="3" height="16"/><rect x="1644" y="178" width="1.5" height="16"/>
      <rect x="1648" y="178" width="4" height="16"/><rect x="1655" y="178" width="1.5" height="16"/>
      <rect x="1659" y="178" width="2.5" height="16"/><rect x="1665" y="178" width="5" height="16"/>
      <rect x="1673" y="178" width="1.5" height="16"/><rect x="1678" y="178" width="3" height="16"/>
      <rect x="1684" y="178" width="2" height="16"/><rect x="1689" y="178" width="4" height="16"/>
    </g>
    <text x="1496" y="212" font-size="7.5" fill="#3a2410">YOUR ORDER IS PROCESSED BY ARASAKA CONSUMER TECHNOLOGY.</text>
  </g>

  <!-- ===== customer meta ===== -->
  <g font-size="14">
    <text x="230" y="330" letter-spacing="1" fill="#8a7048">CUSTOMER</text>
    <text x="470" y="330" fill="#d3b279" text-anchor="end">#NC488402</text>
    <text x="230" y="356" letter-spacing="1" fill="#8a7048">LOYALTY DISCOUNT</text>
    <text x="470" y="356" fill="#d3b279" text-anchor="end">10%</text>
    <text x="230" y="382" letter-spacing="1" fill="#8a7048">LAST UPDATE</text>
    <text x="470" y="382" fill="#d3b279" text-anchor="end">10/05/2077</text>
  </g>

  <!-- ===== nav pills ===== -->
  <g font-size="16" letter-spacing="1">
    <rect x="230" y="430" width="180" height="30" rx="5" fill="none" stroke="#916424" stroke-width="1.4"/>
    <text x="250" y="451" fill="#d3b279">RIFLES</text>

    <g>
      <rect x="230" y="478" width="180" height="30" rx="5" fill="url(#veneer)"/>
      <rect x="230" y="478" width="180" height="30" rx="5" fill="url(#grain)"/>
      <text x="250" y="499" fill="#3a2410" font-weight="600">SMG</text>
    </g>

    <rect x="230" y="526" width="180" height="30" rx="5" fill="none" stroke="#916424" stroke-width="1.4"/>
    <text x="250" y="547" fill="#d3b279">SNIPER</text>

    <rect x="230" y="574" width="180" height="30" rx="5" fill="none" stroke="#916424" stroke-width="1.4"/>
    <text x="250" y="595" fill="#d3b279">SHOTGUN</text>

    <rect x="230" y="622" width="180" height="30" rx="5" fill="none" stroke="#916424" stroke-width="1.4"/>
    <text x="250" y="643" fill="#d3b279">PISTOL</text>
  </g>

  <!-- ===== product cards ===== -->
  <!-- card 1: default -->
  <g>
    <path d="M520 380 h190 l30 30 v300 q0 14 -14 14 h-206 q-14 0 -14 -14 v-316 q0 -14 14 -14 Z"
          fill="#100c0f" stroke="#916424" stroke-width="1.6"/>
    <g stroke="#d3b279" stroke-width="2.4" fill="none">
      <path d="M550 442 h120 l16 10 h26 v16 h-32 l-10 12 h-72 l-9 -10 h-39 Z"/>
      <path d="M584 480 v18 h17 v-18"/>
    </g>
    <g font-size="13" letter-spacing="1" fill="#d3b279" text-anchor="middle">
      <text x="556" y="548">DPS</text><text x="612" y="548">PNT</text>
      <text x="668" y="548">ACC</text><text x="716" y="548">ROF</text>
    </g>
    <g font-size="20" font-weight="600" fill="#e7c686" text-anchor="middle">
      <text x="556" y="576">620</text><text x="612" y="576">30</text>
      <text x="668" y="576">5</text><text x="716" y="576">5</text>
    </g>
    <g>
      <rect x="534" y="596" width="60" height="26" fill="none" stroke="#916424"/>
      <rect x="602" y="596" width="60" height="26" fill="none" stroke="#916424"/>
      <rect x="670" y="596" width="60" height="26" fill="none" stroke="#916424"/>
      <g font-size="8" fill="#d3b279" text-anchor="middle">
        <text x="564" y="612">EMPTY SOCKET</text><text x="632" y="612">EMPTY SOCKET</text><text x="700" y="612">EMPTY SOCKET</text>
      </g>
    </g>
    <rect x="506" y="694" width="244" height="26" fill="#d3b279"/>
    <text x="520" y="712" font-size="14" font-weight="700" fill="#3a2410">MAGNUM 650 <tspan font-weight="400">HAND GUN</tspan></text>
  </g>

  <!-- card 2: SELECTED, veneer, grown, lifted above the row -->
  <g>
    <path d="M800 340 h190 l30 30 v410 q0 14 -14 14 h-206 q-14 0 -14 -14 v-426 q0 -14 14 -14 Z"
          fill="url(#veneer)" stroke="#e7c686" stroke-width="1.6"/>
    <path d="M800 340 h190 l30 30 v410 q0 14 -14 14 h-206 q-14 0 -14 -14 v-426 q0 -14 14 -14 Z"
          fill="url(#grain)"/>
    <g stroke="#3a2410" stroke-width="2.4" fill="none">
      <path d="M830 402 h120 l16 10 h26 v16 h-32 l-10 12 h-72 l-9 -10 h-39 Z"/>
      <path d="M864 440 v18 h17 v-18"/>
    </g>
    <g font-size="13" letter-spacing="1" fill="#3a2410" text-anchor="middle">
      <text x="836" y="508">DPS</text><text x="892" y="508">PNT</text>
      <text x="948" y="508">ACC</text><text x="996" y="508">ROF</text>
    </g>
    <g font-size="20" font-weight="700" fill="#3a2410" text-anchor="middle">
      <text x="836" y="536">620</text><text x="892" y="536">30</text>
      <text x="948" y="536">5</text><text x="996" y="536">5</text>
    </g>
    <g font-size="15" fill="#3a2410">
      <text x="822" y="576">20&#160;&#160;&#160;Recoil</text>
      <text x="822" y="600">22&#160;&#160;&#160;Spread</text>
      <text x="822" y="624">12&#160;&#160;&#160;Range</text>
      <text x="822" y="654" font-weight="700">Bonus</text>
      <text x="822" y="678">+9 Reflexes</text>
      <text x="822" y="702">+2 Modules Slots</text>
    </g>
    <rect x="786" y="724" width="244" height="26" fill="#3a2410"/>
    <text x="800" y="742" font-size="14" font-weight="700" fill="#e7c686">MAGNUM 650 <tspan font-weight="400">HAND GUN</tspan></text>
  </g>

  <!-- card 3: default -->
  <g>
    <path d="M1080 380 h190 l30 30 v300 q0 14 -14 14 h-206 q-14 0 -14 -14 v-316 q0 -14 14 -14 Z"
          fill="#100c0f" stroke="#916424" stroke-width="1.6"/>
    <g stroke="#d3b279" stroke-width="2.4" fill="none">
      <path d="M1110 442 h120 l16 10 h26 v16 h-32 l-10 12 h-72 l-9 -10 h-39 Z"/>
      <path d="M1144 480 v18 h17 v-18"/>
    </g>
    <g font-size="13" letter-spacing="1" fill="#d3b279" text-anchor="middle">
      <text x="1116" y="548">DPS</text><text x="1172" y="548">PNT</text>
      <text x="1228" y="548">ACC</text><text x="1276" y="548">ROF</text>
    </g>
    <g font-size="20" font-weight="600" fill="#e7c686" text-anchor="middle">
      <text x="1116" y="576">620</text><text x="1172" y="576">30</text>
      <text x="1228" y="576">5</text><text x="1276" y="576">5</text>
    </g>
    <g>
      <rect x="1094" y="596" width="60" height="26" fill="none" stroke="#916424"/>
      <rect x="1162" y="596" width="60" height="26" fill="none" stroke="#916424"/>
      <rect x="1230" y="596" width="60" height="26" fill="none" stroke="#916424"/>
      <g font-size="8" fill="#d3b279" text-anchor="middle">
        <text x="1124" y="612">EMPTY SOCKET</text><text x="1192" y="612">EMPTY SOCKET</text><text x="1260" y="612">EMPTY SOCKET</text>
      </g>
    </g>
    <rect x="1066" y="694" width="244" height="26" fill="#d3b279"/>
    <text x="1080" y="712" font-size="14" font-weight="700" fill="#3a2410">MAGNUM 650 <tspan font-weight="400">HAND GUN</tspan></text>
  </g>

  <!-- card 4: default -->
  <g>
    <path d="M1360 380 h190 l30 30 v300 q0 14 -14 14 h-206 q-14 0 -14 -14 v-316 q0 -14 14 -14 Z"
          fill="#100c0f" stroke="#916424" stroke-width="1.6"/>
    <g stroke="#d3b279" stroke-width="2.4" fill="none">
      <path d="M1390 442 h120 l16 10 h26 v16 h-32 l-10 12 h-72 l-9 -10 h-39 Z"/>
      <path d="M1424 480 v18 h17 v-18"/>
    </g>
    <g font-size="13" letter-spacing="1" fill="#d3b279" text-anchor="middle">
      <text x="1396" y="548">DPS</text><text x="1452" y="548">PNT</text>
      <text x="1508" y="548">ACC</text><text x="1556" y="548">ROF</text>
    </g>
    <g font-size="20" font-weight="600" fill="#e7c686" text-anchor="middle">
      <text x="1396" y="576">620</text><text x="1452" y="576">30</text>
      <text x="1508" y="576">5</text><text x="1556" y="576">5</text>
    </g>
    <g>
      <rect x="1374" y="596" width="60" height="26" fill="none" stroke="#916424"/>
      <rect x="1442" y="596" width="60" height="26" fill="none" stroke="#916424"/>
      <rect x="1510" y="596" width="60" height="26" fill="none" stroke="#916424"/>
      <g font-size="8" fill="#d3b279" text-anchor="middle">
        <text x="1404" y="612">EMPTY SOCKET</text><text x="1472" y="612">EMPTY SOCKET</text><text x="1540" y="612">EMPTY SOCKET</text>
      </g>
    </g>
    <rect x="1346" y="694" width="244" height="26" fill="#d3b279"/>
    <text x="1360" y="712" font-size="14" font-weight="700" fill="#3a2410">MAGNUM 650 <tspan font-weight="400">HAND GUN</tspan></text>
  </g>

  <!-- footnote B under the cards -->
  <rect x="800" y="790" width="24" height="24" fill="#0d0b10" stroke="#d3b279" stroke-width="1.5"/>
  <text x="812" y="807" font-size="14" font-weight="700" fill="#d3b279" text-anchor="middle">B</text>
  <text x="836" y="799" font-size="8" fill="#8a7048">SPARE TIME MANAGER WAS DEVELOPED BY SEOCHO.</text>
  <text x="836" y="809" font-size="8" fill="#8a7048">SERVING CUSTOMERS SINCE 2006.</text>

  <!-- ===== strata foot + caption ===== -->
  <g stroke="#634427" stroke-width="1" fill="none">
    <path d="M230 856 h1460" opacity="0.9"/>
    <path d="M244 863 h1432" opacity="0.7"/>
    <path d="M264 870 h1392" opacity="0.5"/>
    <path d="M292 877 h1336" opacity="0.35"/>
    <path d="M330 884 h1260" opacity="0.22"/>
