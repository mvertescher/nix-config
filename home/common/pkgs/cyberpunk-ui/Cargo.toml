[package]
name = "cyberpunk-ui"
version = "0.0.0"
edition = "2021"
autoexamples = false
autobins = false

[dependencies]
iced = { version = "0.13", features = ["advanced", "canvas", "tokio"] }
iced_layershell = "0.13"
sysinfo = "0.33"
# PulseAudio client bindings for the bar's audio module. Apache-2.0,
# and the only Rust route to a sink volume that does not shell out to
# pactl on every tick.
libpulse-binding = "2.28"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# StatusNotifierItem tray, over the session bus. MIT, pure Rust, and
# already the D-Bus stack this repo uses elsewhere (`mpris-status`), so
# the tray adds no second one. `async-io` rather than the tokio feature:
# the tray owns a plain thread like the other sensors, outside iced's
# runtime, and zbus::block_on wants an executor it brought itself.
zbus = { version = "5", default-features = false, features = ["async-io"] }

[[bin]]
name = "cyberpunk-ui-bar"
path = "examples/cyberpunk-ui-bar.rs"

# The same view in an ordinary window, for the golden tests.
# See the head of its source for why it is not a flag on the bar.
[[bin]]
name = "cyberpunk-ui-bar-window"
path = "examples/cyberpunk-ui-bar-window.rs"

[[bin]]
name = "cyberpunk-ui-login"
path = "examples/cyberpunk-ui-login.rs"

[[bin]]
name = "cyberpunk-ui-mailbox"
path = "examples/cyberpunk-ui-mailbox.rs"

[[bin]]
name = "cyberpunk-ui-store"
path = "examples/cyberpunk-ui-store.rs"

[[bin]]
name = "cyberpunk-ui-dashboard"
path = "examples/cyberpunk-ui-dashboard.rs"

[[bin]]
name = "cyberpunk-ui-mail"
path = "examples/cyberpunk-ui-mail.rs"

[[bin]]
name = "cyberpunk-ui-floppy"
path = "examples/cyberpunk-ui-floppy.rs"
